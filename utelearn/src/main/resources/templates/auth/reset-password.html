<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - UTELearn LMS Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #eef2ff 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            margin: 0; padding: 24px 16px; color: #1e293b;
        }
        .auth-card {
            width: 100%; max-width: 440px; background: #ffffff; border: 1px solid #e2e8f0;
            border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            overflow: hidden; animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header { padding: 36px 32px 16px; text-align: center; }
        .brand-logo-icon {
            width: 58px; height: 58px; background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
            color: #ffffff; font-size: 28px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35); margin-bottom: 14px;
        }
        .brand-title { color: #0f172a; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; margin-bottom: 6px; }
        .brand-subtitle { color: #64748b; font-size: 13.5px; line-height: 1.5; margin: 0; }
        .auth-card-body { padding: 16px 32px 36px; }
        .form-label { color: #334155; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
        .input-group { border-radius: 12px; transition: all 0.2s ease; }
        .input-group:focus-within { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); border-radius: 12px; }
        .input-group-text {
            background-color: #f8fafc; border: 1.5px solid #cbd5e1; border-right: none; color: #64748b;
            border-radius: 12px 0 0 12px !important; padding: 12px 14px; font-size: 15px; transition: border-color 0.2s;
        }
        .form-control {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; border-left: none; color: #0f172a;
            border-radius: 0 12px 12px 0 !important; padding: 12px 14px; font-size: 14px; font-weight: 500; transition: border-color 0.2s;
        }
        .input-group:focus-within .input-group-text, .input-group:focus-within .form-control { border-color: #2563eb; }
        .form-control:focus { box-shadow: none; background-color: #ffffff; color: #0f172a; }
        .form-control::placeholder { color: #94a3b8; font-weight: 400; }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); border: none; color: #ffffff; font-weight: 600; font-size: 14.5px;
            padding: 13px; border-radius: 12px; transition: all 0.25s ease; box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary-gradient:hover { background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); transform: translateY(-1px); box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.5); color: #ffffff; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <div class="brand-logo-icon">
            <i class="bi bi-key-fill"></i>
        </div>
        <div class="brand-title">Đặt mật khẩu mới</div>
        <p class="brand-subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
    </div>

    <div class="auth-card-body">
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert" style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 12px; font-size: 13.5px;">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
            <div th:text="${errorMessage}"></div>
        </div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
            <input type="hidden" th:field="*{token}" />
            
            <div class="mb-3">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Nhập mật khẩu mới..." required autofocus>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu..." required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100">
                <i class="bi bi-check2-circle"></i>
                <span>Cập nhật mật khẩu</span>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
