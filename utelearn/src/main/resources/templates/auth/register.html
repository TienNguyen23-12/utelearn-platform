<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - UTELearn LMS Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 16px;
            color: #1e293b;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header {
            padding: 36px 32px 14px;
            text-align: center;
        }
        .brand-logo-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 26px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35);
            margin-bottom: 14px;
        }
        .brand-title {
            color: #0f172a;
            font-weight: 800;
            font-size: 23px;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .brand-title span {
            color: #2563eb;
        }
        .brand-subtitle {
            color: #64748b;
            font-size: 13.5px;
            margin: 0;
        }
        .auth-card-body {
            padding: 16px 32px 36px;
        }
        .form-label {
            color: #334155;
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 6px;
        }
        .input-group {
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .input-group:focus-within {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            border-radius: 12px;
        }
        .input-group-text {
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-right: none;
            color: #64748b;
            border-radius: 12px 0 0 12px !important;
            padding: 12px 14px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control {
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-left: none;
            color: #0f172a;
            border-radius: 0 12px 12px 0 !important;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #2563eb;
        }
        .form-control:focus {
            box-shadow: none;
            background-color: #ffffff;
            color: #0f172a;
        }
        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .field-error {
            color: #dc2626;
            font-size: 12.5px;
            margin-top: 4px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 14.5px;
            padding: 13px;
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.5);
            color: #ffffff;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 18px;
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider span {
            padding: 0 12px;
        }
        .btn-google {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }
        .btn-google:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            color: #0f172a;
        }
        .auth-footer-links {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13.5px;
        }
        .auth-footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer-links a:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <div class="brand-logo-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <div class="brand-title">Đăng ký tài khoản <span>UTELearn</span></div>
        <p class="brand-subtitle">Trở thành thành viên cộng đồng học tập số HCMUTE</p>
    </div>

    <div class="auth-card-body">
        <!-- Thông báo lỗi chung -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert" style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 12px; font-size: 13.5px;">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
            <div th:text="${errorMessage}">Đã xảy ra lỗi đăng ký!</div>
        </div>

        <!-- FORM ĐĂNG KÝ (CHỈ CẦN EMAIL, MẬT KHẨU, XÁC NHẬN MẬT KHẨU) -->
        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" for="email">Địa chỉ Email <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="vd: vana@utelearn.edu.vn" required autofocus>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('email')}">
                    <i class="bi bi-x-circle"></i> <span th:errors="*{email}"></span>
                </div>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
                <label class="form-label" for="password">Mật khẩu <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}">
                    <i class="bi bi-x-circle"></i> <span th:errors="*{password}"></span>
                </div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}">
                    <i class="bi bi-x-circle"></i> <span th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <!-- Nút đăng ký -->
            <button type="submit" class="btn btn-primary-gradient w-100">
                <i class="bi bi-person-check-fill"></i>
                <span>Đăng ký tài khoản</span>
            </button>
        </form>

        <!-- ĐƯỜNG PHÂN CÁCH -->
        <div class="divider">
            <span>Hoặc đăng ký nhanh bằng</span>
        </div>

        <!-- NÚT GOOGLE OAUTH (Ở DƯỚI) -->
        <a th:href="@{/oauth2/authorization/google}" class="btn btn-google w-100">
            <svg width="19" height="19" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Đăng ký nhanh với tài khoản Google</span>
        </a>

        <!-- LIÊN KẾT ĐĂNG NHẬP -->
        <div class="auth-footer-links">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
