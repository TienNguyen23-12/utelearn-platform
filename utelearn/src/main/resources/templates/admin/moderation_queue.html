<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Duyệt Nội Dung Vượt Cấp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('admin_moderation')}"></aside>

<div class="app-content-wrapper">
    <header th:replace="~{fragments/navbar :: navbar('Duyệt Nội Dung Vượt Cấp')}"></header>

    <main class="app-main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1 text-danger">Hàng đợi Admin (Vượt cấp)</h3>
                <p class="text-muted mb-0">Các nội dung khó do Moderator chuyển lên</p>
            </div>
        </div>

        <div class="card card-custom border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light text-muted" style="font-size: 13px;">
                    <tr>
                        <th class="fw-semibold ps-4">Mã Task</th>
                        <th class="fw-semibold">Tác giả</th>
                        <th class="fw-semibold">Người chuyển</th>
                        <th class="fw-semibold">Lý do chuyển</th>
                        <th class="fw-semibold text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="border-top-0">
                    <tr th:if="${#lists.isEmpty(tasks)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-shield-check fs-1 d-block mb-3 text-success"></i>
                            Không có yêu cầu vượt cấp nào.
                        </td>
                    </tr>
                    <tr th:each="task : ${tasks}">
                        <td class="ps-4 fw-medium text-dark">#<span th:text="${task.id}">1</span></td>
                        <td th:text="${task.author?.fullName}">Giảng viên</td>
                        <td th:text="${task.escalatedBy?.fullName}">Moderator</td>
                        <td>
                            <small class="text-muted" th:text="${task.escalationReason}">Lý do...</small>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/moderator/review/{id}(id=${task.id})}" class="btn btn-sm btn-danger rounded-pill px-3">
                                <i class="bi bi-hammer me-1"></i> Xử lý
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-layout.js}"></script>
</body>
</html>
