<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp học - UTELearn Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('cohorts')}"></aside>

<div class="app-content-wrapper">
    <header th:replace="~{fragments/navbar :: navbar('Lớp học')}"></header>

    <main class="app-main-content">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <a th:href="@{/instructor/cohorts}" class="text-decoration-none text-muted mb-2 d-inline-block">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                </a>
                <h4 class="fw-bold mb-0" th:text="${cohortId != null ? 'Chỉnh sửa Lớp học' : 'Tạo Lớp học mới'}">Tạo/Sửa Lớp học</h4>
            </div>
        </div>

        <div class="card card-custom p-4">
            <form th:action="${cohortId != null ? '/instructor/cohorts/' + cohortId + '/edit' : '/instructor/cohorts/create'}" 
                  th:object="${cohortDto}" method="post">
                  
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mã Lớp Học</label>
                        <input type="text" class="form-control bg-light" th:field="*{code}" readonly th:placeholder="${cohortId == null ? 'Hệ thống sẽ tự động sinh khi lưu' : ''}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên Lớp Học <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Khóa học gốc <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{courseId}" required>
                            <option value="">-- Chọn khóa học --</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bắt đầu Ghi danh</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{enrollmentStart}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kết thúc Ghi danh</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{enrollmentEnd}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bắt đầu Học</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{studyStart}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kết thúc Học</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{studyEnd}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Sức chứa tối đa</label>
                        <input type="number" class="form-control" th:field="*{maxCapacity}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Giá (VNĐ)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="UPCOMING">Sắp mở</option>
                            <option value="ENROLLING">Đang ghi danh</option>
                            <option value="IN_PROGRESS">Đang học</option>
                            <option value="COMPLETED">Đã kết thúc</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-top">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h5 class="fw-bold mb-1"><i class="bi bi-calendar-check text-primary me-2"></i>Lịch trình bài học (Cohort Schedules)</h5>
                            <p class="text-muted small mb-0">Cấu hình ngày mở bài và hạn nộp cho từng bài. Nếu là lớp học tự do (Self-paced), set ngày mở cho tất cả các bài là ngày hôm nay và để trống hạn chót.</p>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setAllUnlockAtNow()">Set tất cả mở ngay lập tức</button>
                    </div>
                    
                    <div id="curriculum-schedules" class="accordion">
                        <div class="text-center text-muted py-5 bg-light rounded-4 border">
                            <i class="bi bi-arrow-up-circle fs-3 d-block mb-2 text-secondary opacity-50"></i>
                            Vui lòng chọn khóa học gốc ở trên để tải danh sách bài học.
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 pt-3 border-top d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4 rounded-pill">
                        <i class="bi bi-save me-1"></i> Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-layout.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
    function initDatepickers() {
        flatpickr(".datetimepicker", {
            enableTime: true,
            dateFormat: "Y-m-d\\TH:i",
            altInput: true,
            altFormat: "d/m/Y H:i",
            time_24hr: true,
            locale: "vn"
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initDatepickers();
        
        const courseSelect = document.getElementById('courseId');
        const scheduleContainer = document.getElementById('curriculum-schedules');
        
        // Cố gắng trigger load nếu đang ở trạng thái sửa hoặc đã chọn sẵn
        if (courseSelect.value) {
            loadCurriculum(courseSelect.value);
        }

        courseSelect.addEventListener('change', function() {
            loadCurriculum(this.value);
        });
        
        function loadCurriculum(courseId) {
            if (!courseId) {
                scheduleContainer.innerHTML = '<div class="text-center text-muted py-5 bg-light rounded-4 border">Vui lòng chọn khóa học gốc ở trên để tải danh sách bài học.</div>';
                return;
            }
            
            scheduleContainer.innerHTML = '<div class="text-center text-muted py-5 bg-light rounded-4 border"><div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div><br>Đang tải danh sách bài học...</div>';
            
            fetch('/api/instructor/courses/' + courseId + '/full-curriculum')
                .then(res => res.json())
                .then(data => {
                    if(data.length === 0) {
                        scheduleContainer.innerHTML = '<div class="text-center text-muted py-5 bg-light rounded-4 border">Khóa học này chưa có nội dung bài học nào. Vui lòng quay lại Quản lý Khóa học để thêm bài giảng trước khi mở lớp.</div>';
                        return;
                    }
                    
                    let html = '';
                    let scheduleIndex = 0;
                    
                    data.forEach((section, sIndex) => {
                        html += `
                        <div class="accordion-item border-0 mb-3 bg-white shadow-sm rounded-4 overflow-hidden">
                            <h2 class="accordion-header" id="heading-${sIndex}">
                                <button class="accordion-button bg-light fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${sIndex}" aria-expanded="true">
                                    <i class="bi bi-folder2-open me-2 text-primary"></i> ${section.title}
                                </button>
                            </h2>
                            <div id="collapse-${sIndex}" class="accordion-collapse collapse show">
                                <div class="accordion-body p-0">
                                    <table class="table table-hover table-sm mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th style="width: 35%" class="ps-4">Tên bài học</th>
                                                <th style="width: 25%">Ngày mở (Unlock At)</th>
                                                <th style="width: 20%">Hạn chót (Deadline)</th>
                                                <th style="width: 20%" class="pe-4">Cấu hình điểm</th>
                                            </tr>
                                        </thead>
                                        <tbody>`;
                        
                        section.lessons.forEach(lesson => {
                            let icon = lesson.lessonType === 'VIDEO' ? 'bi-play-circle-fill text-danger' : 
                                      (lesson.lessonType === 'DOCUMENT' ? 'bi-file-earmark-text-fill text-info' : 'bi-patch-question-fill text-warning');
                            
                            html += `
                                <tr>
                                    <td class="align-middle ps-4">
                                        <input type="hidden" name="schedules[${scheduleIndex}].lessonId" value="${lesson.id}">
                                        <i class="bi ${icon} me-1"></i>
                                        <span class="small fw-medium">${lesson.title}</span>
                                    </td>
                                    <td class="align-middle">
                                        <input type="text" class="form-control form-control-sm datetimepicker unlock-at-input" name="schedules[${scheduleIndex}].unlockAt">
                                    </td>
                                    <td class="align-middle">
                                        <input type="text" class="form-control form-control-sm datetimepicker" name="schedules[${scheduleIndex}].deadlineAt">
                                    </td>
                                    <td class="align-middle pe-4">
                                        <select class="form-select form-select-sm" name="schedules[${scheduleIndex}].showScoreType">
                                            <option value="IMMEDIATELY">Ngay lập tức</option>
                                            <option value="AFTER_DEADLINE">Sau khi hết hạn</option>
                                            <option value="MANUAL">Chấm tay</option>
                                        </select>
                                    </td>
                                </tr>`;
                            scheduleIndex++;
                        });
                        
                        html += `       </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>`;
                    });
                    
                    scheduleContainer.innerHTML = html;
                    initDatepickers();
                })
                .catch(err => {
                    scheduleContainer.innerHTML = '<div class="text-center text-danger py-5 bg-light rounded-4 border">Lỗi tải danh sách bài học. Vui lòng thử lại.</div>';
                    console.error(err);
                });
        }
    });

    // Tiện ích: Set tất cả unlock_at về thời điểm hiện tại (Dành cho Lớp học tự do / Udemy style)
    function setAllUnlockAtNow() {
        const inputs = document.querySelectorAll('.unlock-at-input');
        if (inputs.length === 0) return;
        
        // Format YYYY-MM-DDThh:mm
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        const nowStr = now.toISOString().slice(0,16);
        
        inputs.forEach(input => {
            // Flatpickr instance is attached to the input element as _flatpickr
            if (input._flatpickr) {
                input._flatpickr.setDate(nowStr);
            } else {
                input.value = nowStr;
            }
        });
    }
</script>
</body>
</html>
