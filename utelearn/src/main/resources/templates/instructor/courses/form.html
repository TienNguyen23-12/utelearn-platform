<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa Khóa học' : 'Thêm Khóa học mới'} + ' - UTELearn Platform'">Khóa học</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('courses')}"></aside>

<div class="app-content-wrapper">
    <header th:replace="~{fragments/navbar :: navbar('Khóa học & Lớp học')}"></header>

    <main class="app-main-content">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/instructor/courses}" class="btn btn-icon btn-light rounded-circle me-3 border">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="fw-bold mb-1" th:text="${isEdit ? 'Chỉnh sửa Khóa học' : 'Tạo Khóa học mới'}">Tiêu đề</h4>
                <p class="text-muted mb-0">Điền các thông tin cơ bản về khóa học của bạn</p>
            </div>
        </div>

        <div class="card card-custom p-4" style="max-width: 800px;">
            <form id="courseForm">
                <input type="hidden" id="courseId" th:value="${course != null ? course.id : ''}">
                
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Mã khóa học <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="code" name="code" th:value="${course != null ? course.code : ''}" required placeholder="VD: CS101">
                    </div>
                    <div class="col-md-9">
                        <label class="form-label fw-semibold">Tiêu đề khóa học <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" th:value="${course != null ? course.title : ''}" required placeholder="VD: Lập trình Java Spring Boot căn bản">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Mô tả ngắn (Headline)</label>
                        <textarea class="form-control" id="headline" name="headline" rows="2" placeholder="Tóm tắt ngắn gọn về khóa học..." th:text="${course != null ? course.headline : ''}"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                        <select class="form-select" id="categoryId" name="categoryId" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${course != null && course.category != null && course.category.id == cat.id}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cấp độ <span class="text-danger">*</span></label>
                        <select class="form-select" id="level" name="level" required>
                            <option value="ALL_LEVELS" th:selected="${course == null || course.level == 'ALL_LEVELS'}">Mọi cấp độ</option>
                            <option value="BEGINNER" th:selected="${course != null && course.level == 'BEGINNER'}">Người mới bắt đầu</option>
                            <option value="INTERMEDIATE" th:selected="${course != null && course.level == 'INTERMEDIATE'}">Trung bình</option>
                            <option value="ADVANCED" th:selected="${course != null && course.level == 'ADVANCED'}">Nâng cao</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">URL Ảnh bìa (Thumbnail)</label>
                        <input type="url" class="form-control" id="thumbnailUrl" name="thumbnailUrl" th:value="${course != null ? course.thumbnailUrl : ''}" placeholder="https://...">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Giới thiệu chi tiết</label>
                        <textarea class="form-control" id="description" name="description" rows="5" placeholder="Viết mô tả chi tiết nội dung khóa học..." th:text="${course != null ? course.description : ''}"></textarea>
                    </div>
                </div>

                <hr class="my-4">
                
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/instructor/courses}" class="btn btn-light border px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4" id="btnSubmit">
                        <i class="bi bi-floppy me-1"></i> Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script th:src="@{/js/admin-layout.js}"></script>
<script>
    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    document.getElementById('courseForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang lưu...';

        const courseId = document.getElementById('courseId').value;
        const isEdit = courseId !== '';
        
        const data = {
            code: document.getElementById('code').value,
            title: document.getElementById('title').value,
            headline: document.getElementById('headline').value,
            categoryId: parseInt(document.getElementById('categoryId').value),
            level: document.getElementById('level').value,
            thumbnailUrl: document.getElementById('thumbnailUrl').value,
            description: document.getElementById('description').value
        };

        const url = isEdit ? `/api/instructor/courses/${courseId}` : '/api/instructor/courses';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (response.ok) {
                showToast(result.message, 'success');
                
                setTimeout(() => {
                    window.location.href = '/instructor/courses';
                }, 1000);
            } else {
                showToast(result.message || 'Có lỗi xảy ra', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-floppy me-1"></i> Lưu lại';
            }
        } catch (error) {
            console.error(error);
            showToast('Lỗi kết nối máy chủ', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-floppy me-1"></i> Lưu lại';
        }
    });
</script>
</body>
</html>
