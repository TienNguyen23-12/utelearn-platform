<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<header th:fragment="navbar(pageTitle)" class="app-header navbar navbar-expand px-4 py-0">
    <div class="container-fluid p-0">
        <!-- Sidebar Toggle & Page Title -->
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-light d-flex align-items-center justify-content-center rounded-circle border-0 text-dark" style="width: 40px; height: 40px;" type="button" onclick="toggleSidebar()" title="Đóng/Mở thanh bên">
                <i class="bi bi-list fs-5"></i>
            </button>
            <div>
                <h5 class="fw-bold text-dark mb-0 fs-6" th:text="${pageTitle}">Trang Quản trị</h5>
            </div>
        </div>

        <!-- Right Side Nav Elements -->
        <div class="d-flex align-items-center gap-3 ms-auto">
            <!-- Thông tin nhanh Người dùng Dropdown -->
            <div class="dropdown" th:if="${currentUser != null}">
                <button class="btn btn-light d-flex align-items-center gap-2 border-0 py-1 px-3 rounded-pill" style="background-color: #f8fafc;" type="button" data-bs-toggle="dropdown">
                    <div th:if="${currentUser.avatarUrl}" class="rounded-circle overflow-hidden" style="width: 36px; height: 36px;">
                        <img th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover">
                    </div>
                    <div th:unless="${currentUser.avatarUrl}" class="user-avatar-placeholder" style="width: 36px; height: 36px; font-size: 13px;" th:text="${#strings.substring(currentUser.fullName, 0, 1)}">U</div>
                    <div class="d-none d-md-block text-start pe-1">
                        <div class="fw-bold text-dark lh-1" style="font-size: 13px;" th:text="${currentUser.fullName}">Người dùng</div>
                        <small class="text-muted" style="font-size: 11px;" th:text="${currentUser.email}">admin@utelearn.edu.vn</small>
                    </div>
                    <i class="bi bi-chevron-down text-muted" style="font-size: 11px;"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 mt-2 p-2" style="min-width: 240px;">
                    <li class="px-3 py-2 border-bottom">
                        <div class="fw-bold text-dark small" th:text="${currentUser.fullName}">Quản trị viên</div>
                        <div class="text-muted" style="font-size: 11px;" th:text="${currentUser.email}">admin@utelearn.edu.vn</div>
                        <div class="mt-1">
                            <span th:each="r : ${currentUser.roles}" class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 py-1" style="font-size: 10px;" th:text="${r.name}">Quản trị viên</span>
                        </div>
                    </li>
                    <li><a class="dropdown-item py-2 small rounded-3 mt-1" href="/dashboard"><i class="bi bi-grid-1x2-fill me-2 text-primary"></i>Bảng điều khiển</a></li>
                    <li><a class="dropdown-item py-2 small rounded-3" href="/profile"><i class="bi bi-person-circle me-2 text-success"></i>Hồ sơ cá nhân</a></li>
                    <li th:if="${@rbac.hasRole('ADMIN')}"><a class="dropdown-item py-2 small rounded-3" href="/admin/users"><i class="bi bi-people-fill me-2 text-info"></i>Quản lý Tài khoản</a></li>
                    <li th:if="${@rbac.hasRole('ADMIN')}"><a class="dropdown-item py-2 small rounded-3" href="/admin/roles"><i class="bi bi-shield-lock-fill me-2 text-warning"></i>Phân quyền Hệ thống</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item py-2 small rounded-3 text-danger" href="/logout">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>

</body>
</html>
