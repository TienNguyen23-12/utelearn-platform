<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học của tôi - UTELearn LMS Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Admin Master Layout CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Master Sidebar Fragment -->
<aside th:replace="~{fragments/sidebar :: sidebar('my_courses')}"></aside>

<!-- Master Content Wrapper -->
<div class="app-content-wrapper">
    <!-- Top Navbar Fragment -->
    <header th:replace="~{fragments/navbar :: navbar('Khóa học của tôi')}"></header>

    <!-- Main Content Area -->
    <main class="app-main-content">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                <h5 class="fw-bold text-dark mb-1">
                    <i class="bi bi-journal-check text-primary me-2"></i>Các khóa học đã tham gia
                </h5>
                <p class="text-muted small mb-0">Tiếp tục hành trình học tập của bạn</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${myCourses == null || myCourses.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-folder-x display-4 mb-3 d-block text-secondary opacity-50"></i>
                    <h6>Bạn chưa tham gia khóa học nào.</h6>
                    <a href="/courses" class="btn btn-outline-primary rounded-pill mt-3 px-4">Khám phá khóa học</a>
                </div>
                <div th:if="${myCourses != null && !myCourses.isEmpty()}" class="row g-4">
                    <div th:each="enrollment : ${myCourses}" class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden" style="transition: transform 0.2s;">
                            <img th:src="${enrollment.course.thumbnailUrl != null ? enrollment.course.thumbnailUrl : 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80'}" class="card-img-top" alt="Course thumbnail" style="height: 160px; object-fit: cover;">
                            <div class="card-body p-3 d-flex flex-column">
                                <h6 class="card-title fw-bold text-dark mb-2" th:text="${enrollment.course.title}">Course Title</h6>
                                <p class="card-text text-muted small mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${enrollment.course.headline}">Headline</p>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <span class="badge bg-primary-subtle text-primary small">
                                        Tiến độ: <span th:text="${enrollment.progress + '%'}">0%</span>
                                    </span>
                                    <a th:href="@{'/courses/' + ${enrollment.course.slug} + '/learn'}" class="btn btn-sm btn-primary rounded-pill px-3">
                                        Tiếp tục học
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Admin Custom JS -->
<script th:src="@{/js/admin-layout.js}"></script>
</body>
</html>
