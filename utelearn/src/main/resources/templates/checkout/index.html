<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán khóa học - UTELearn Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="site-navbar navbar navbar-expand-lg py-3 bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/home">
            <span class="brand-logo-badge bg-primary text-white p-2 rounded-3"><i class="bi bi-mortarboard-fill"></i></span>
            <span class="brand-title fw-bold fs-4">UTE<span class="text-primary">Learn</span></span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <!-- ĐÃ ĐĂNG NHẬP -->
            <div th:if="${currentUser != null}" class="d-flex align-items-center gap-2">
                <div th:if="${currentUser.avatarUrl}" class="rounded-circle overflow-hidden" style="width: 34px; height: 34px;">
                    <img th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover">
                </div>
                <div th:unless="${currentUser.avatarUrl}" class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 34px; height: 34px; font-size: 13px;" th:text="${#strings.substring(currentUser.fullName, 0, 1)}">U</div>
                <div class="text-start pe-1 d-none d-md-block">
                    <div class="fw-bold text-dark lh-1" style="font-size: 13.5px;" th:text="${currentUser.fullName}">Người dùng</div>
                    <small class="text-muted" style="font-size: 11px;" th:text="${currentUser.email}">user@utelearn.edu.vn</small>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
                <div class="card-header bg-white p-4 border-bottom">
                    <h4 class="fw-bold mb-0 text-primary">
                        <i class="bi bi-credit-card-2-front me-2"></i>Thanh toán khóa học
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div class="row align-items-center mb-4">
                        <div class="col-md-3">
                            <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80'}" class="img-fluid rounded-3" alt="Course Thumbnail">
                        </div>
                        <div class="col-md-9 mt-3 mt-md-0">
                            <span class="badge bg-primary-subtle text-primary mb-2">Đợt học: <span th:text="${cohort.code}"></span></span>
                            <h5 class="fw-bold mb-1" th:text="${course.title}">Tên khóa học</h5>
                            <p class="text-muted small mb-0" th:text="${cohort.name}">Tên đợt học</p>
                        </div>
                    </div>

                    <hr class="text-muted">

                    <div class="d-flex justify-content-between align-items-center my-4">
                        <h5 class="fw-bold text-dark mb-0">Tổng tiền thanh toán</h5>
                        <h4 class="fw-bold text-success mb-0" th:text="${#numbers.formatDecimal(cohort.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</h4>
                    </div>

                    <div class="alert alert-info rounded-3 small">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        Đây là hệ thống thanh toán giả lập. Bạn không bị trừ tiền khi nhấn Xác nhận thanh toán.
                    </div>

                    <form th:action="@{'/checkout/' + ${cohort.id} + '/process'}" method="post">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                                Xác nhận thanh toán <i class="bi bi-arrow-right-circle ms-1"></i>
                            </button>
                            <a th:href="@{'/courses/' + ${course.slug}}" class="btn btn-light rounded-pill">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script th:inline="javascript">
    var errorMessage = /*[[${error}]]*/ null;
    var successMessage = /*[[${success}]]*/ null;
    var infoMessage = /*[[${info}]]*/ null;
    
    document.addEventListener("DOMContentLoaded", function() {
        if (errorMessage) {
            Toastify({text: errorMessage, style: {background: "#dc3545"}}).showToast();
        }
        if (successMessage) {
            Toastify({text: successMessage, style: {background: "#00b050"}}).showToast();
        }
        if (infoMessage) {
            Toastify({text: infoMessage, style: {background: "#0dcaf0", color: "#000"}}).showToast();
        }
    });
</script>
</body>
</html>
