<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module & Chuyên đề - UTELearn Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('cohorts')}"></aside>

<div class="app-content-wrapper">
    <header th:replace="~{fragments/navbar :: navbar('Module & Chuyên đề')}"></header>

    <main class="app-main-content">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <a th:href="@{/instructor/cohorts}" class="text-decoration-none text-muted mb-2 d-inline-block">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                </a>
                <h4 class="fw-bold mb-0" th:text="${cohortId != null ? 'Chỉnh sửa Module học phần' : 'Tạo Module học phần mới'}">Tạo/Sửa Module</h4>
            </div>
            <div th:if="${cohortId != null}" class="d-flex gap-2">
                <a th:href="@{'/instructor/cohorts/' + ${cohortId} + '/curriculum'}" class="btn btn-outline-success rounded-pill px-3">
                    <i class="bi bi-journal-text me-1"></i> Soạn Giáo trình
                </a>
                <a th:href="@{'/instructor/cohorts/' + ${cohortId} + '/schedule'}" class="btn btn-outline-primary rounded-pill px-3">
                    <i class="bi bi-calendar-check me-1"></i> Cấu hình Lộ trình học
                </a>
            </div>
        </div>

        <div class="card card-custom p-4">
            <form th:action="${cohortId != null ? '/instructor/cohorts/' + cohortId + '/edit' : '/instructor/cohorts/create'}" 
                  th:object="${cohortDto}" method="post">
                <input type="hidden" id="currentCohortId" th:value="${cohortId}">
                  
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mã Module</label>
                        <input type="text" class="form-control bg-light" th:field="*{code}" readonly th:placeholder="${cohortId == null ? 'Hệ thống sẽ tự động sinh khi lưu' : ''}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên Module / Chuyên đề <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Khóa học trực thuộc <span class="text-muted fw-normal">(Tùy chọn - để trống nếu là Module bán lẻ độc lập)</span></label>
                        <select class="form-select" th:field="*{courseId}">
                            <option value="">-- Không trực thuộc khóa học nào (Module bán lẻ độc lập) --</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                        <div class="form-text" style="font-size: 11px;">Bạn có thể tạo module độc lập để bán lẻ riêng, hoặc gán vào một khóa học cụ thể để mở rộng giáo trình.</div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">URL Ảnh bìa (Thumbnail)</label>
                        <input type="text" class="form-control" th:field="*{thumbnailUrl}" id="cohortThumbnailUrl" placeholder="https://... (Để trống để sử dụng ảnh bìa mặc định)">
                        <div class="mt-2 d-flex align-items-center gap-3">
                            <span class="text-muted small">Xem trước:</span>
                            <div style="width: 80px; height: 50px; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0;" class="flex-shrink-0 bg-light">
                                <img id="cohortCoverPreview" th:src="${cohortDto != null && cohortDto.thumbnailUrl != null && !cohortDto.thumbnailUrl.isBlank() ? cohortDto.thumbnailUrl : '/images/courses/default-cover.png'}" class="w-100 h-100 object-fit-cover" alt="Preview">
                            </div>
                            <small class="text-muted" style="font-size: 11px;">Nếu không nhập link ảnh bìa, hệ thống sẽ tự động dùng ảnh bìa mặc định của UTELearn.</small>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bắt đầu Ghi danh</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{enrollmentStart}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kết thúc Ghi danh</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{enrollmentEnd}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bắt đầu Học</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{studyStart}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kết thúc Học</label>
                        <input type="text" class="form-control datetimepicker" th:field="*{studyEnd}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Sức chứa tối đa</label>
                        <input type="number" class="form-control" th:field="*{maxCapacity}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Học phí mua lẻ (VNĐ)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Tiến độ đợt học</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="UPCOMING">Sắp mở</option>
                            <option value="ENROLLING">Đang ghi danh</option>
                            <option value="IN_PROGRESS">Đang học</option>
                            <option value="COMPLETED">Đã kết thúc</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Quyền chia sẻ</label>
                        <select class="form-select" th:field="*{visibility}">
                            <option value="PUBLIC">🌐 Cho phép chia sẻ (Public)</option>
                            <option value="PRIVATE">🔒 Độc quyền tác giả (Private)</option>
                        </select>
                    </div>

                    <div class="col-md-12" th:if="${cohortId != null}">
                        <label class="form-label fw-semibold">Người tạo Module / Đợt học</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control bg-light" readonly 
                                   th:value="${cohort != null && cohort.createdBy != null ? cohort.createdBy.fullName + ' (' + cohort.createdBy.username + ')' : 'Chưa thiết lập'}">
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Tiêu đề thông báo hiển thị trong Module</label>
                        <input type="text" class="form-control" th:field="*{announcementTitle}" placeholder="Mặc định: Thông báo chung &amp; Hướng dẫn học tập">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Nội dung thông báo hiển thị trong Module</label>
                        <textarea class="form-control" th:field="*{announcementContent}" rows="2" placeholder="Mặc định: Khóa học được thiết kế theo chuẩn sư phạm tích cực..."></textarea>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                    <a th:href="@{/instructor/cohorts}" class="btn btn-light border px-4 rounded-pill">Quay lại</a>
                    <button type="submit" class="btn btn-primary px-4 rounded-pill">
                        <i class="bi bi-save me-1"></i> Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-layout.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
    function initDatepickers() {
        flatpickr(".datetimepicker", {
            enableTime: true,
            dateFormat: "Y-m-d\\TH:i",
            altInput: true,
            altFormat: "d/m/Y H:i",
            time_24hr: true,
            locale: "vn"
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initDatepickers();

        const cohortThumbnailInput = document.getElementById('cohortThumbnailUrl');
        const cohortCoverPreview = document.getElementById('cohortCoverPreview');
        const defaultCover = '/images/courses/default-cover.png';
        if (cohortThumbnailInput && cohortCoverPreview) {
            cohortThumbnailInput.addEventListener('input', function() {
                const val = this.value.trim();
                cohortCoverPreview.src = val ? val : defaultCover;
            });
            cohortCoverPreview.addEventListener('error', function() {
                this.src = defaultCover;
            });
        }
    });
</script>
</body>
</html>
