<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra sự cố - UTELearn Platform'}">Lỗi - UTELearn Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 16px;
            color: #1e293b;
        }
        .error-card {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.04);
            padding: 48px 36px;
            text-align: center;
            animation: slideUp 0.35s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 26px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #2563eb;
            font-size: 40px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.2);
        }
        .status-code-pill {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 9999px;
            background-color: #fee2e2;
            color: #dc2626;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }
        .uri-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 30px;
            display: inline-block;
            max-width: 100%;
            word-break: break-all;
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px -3px rgba(37, 99, 235, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            transform: translateY(-1px);
            color: #ffffff;
            box-shadow: 0 10px 22px -3px rgba(37, 99, 235, 0.45);
        }
        .btn-outline-soft {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline-soft:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
        }
        .footer-brand {
            margin-top: 36px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-badge">
        <i th:class="${(statusCode == 404 or status == 404) ? 'bi bi-compass' : ((statusCode == 403 or status == 403) ? 'bi bi-shield-x' : ((statusCode == 401 or status == 401) ? 'bi bi-lock' : 'bi bi-exclamation-triangle'))}"></i>
    </div>

    <div>
        <span class="status-code-pill" th:text="'HTTP ' + ${(statusCode != null ? statusCode : (status != null ? status : 500))}">HTTP 404</span>
    </div>

    <h1 class="error-title" th:text="${errorTitle != null ? errorTitle : (error != null ? error : 'Không thể tải trang')}">404 - Không tìm thấy trang</h1>

    <p class="error-desc" th:text="${errorMessage != null ? errorMessage : (message != null ? message : 'Trang bạn đang tìm kiếm không tồn tại hoặc hệ thống gặp sự cố xử lý.')}">
        Trang hoặc tài nguyên bạn yêu cầu hiện không tồn tại hoặc hệ thống gặp sự cố xử lý.
    </p>

    <div class="uri-box" th:if="${(requestUri != null and requestUri != '') or (path != null and path != '')}">
        <i class="bi bi-link-45deg me-1"></i>Đường dẫn: <code th:text="${requestUri != null and requestUri != '' ? requestUri : path}">/requested-url</code>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2">
        <a href="/home" class="btn btn-primary-gradient">
            <i class="bi bi-house-door-fill"></i>
            <span>Về Trang chủ</span>
        </a>
        <a href="/dashboard" class="btn btn-outline-soft">
            <i class="bi bi-speedometer2"></i>
            <span>Bảng điều khiển</span>
        </a>
        <button onclick="window.history.back()" class="btn btn-outline-soft">
            <i class="bi bi-arrow-left"></i>
            <span>Quay lại</span>
        </button>
    </div>

    <div class="footer-brand">
        UTELearn LMS Ecosystem • HCM-UTE Digital Platform
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
