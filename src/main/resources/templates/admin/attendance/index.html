<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/brand/UTELearn_SquareLogo_2.png">
    <link rel="apple-touch-icon" href="/images/brand/UTELearn_SquareLogo_2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê điểm danh Moderator - UTELearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<aside th:replace="~{fragments/sidebar :: sidebar('admin-attendance')}"></aside>

<div class="app-content-wrapper">
    <header th:replace="~{fragments/navbar :: navbar('Thống kê điểm danh')}"></header>

    <main class="app-main-content">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-3 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">Thống kê ca trực Moderator</h5>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Người kiểm duyệt</th>
                                <th>Ngày làm việc</th>
                                <th>Giờ vào</th>
                                <th>Giờ ra</th>
                                <th>Trạng thái</th>
                                <th>Tổng TG (phút)</th>
                                <th>Task xử lý</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="history : ${attendances}">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div th:if="${history.moderator.avatarUrl}" class="rounded-circle overflow-hidden" style="width: 32px; height: 32px;">
                                            <img th:src="${history.moderator.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover">
                                        </div>
                                        <div th:unless="${history.moderator.avatarUrl}" class="user-avatar-placeholder" style="width: 32px; height: 32px; font-size: 12px;" th:text="${#strings.substring(history.moderator.fullName, 0, 1)}">U</div>
                                        <div>
                                            <div class="fw-bold text-dark" style="font-size: 14px;" th:text="${history.moderator.fullName}">Moderator</div>
                                            <div class="text-muted" style="font-size: 12px;" th:text="${history.moderator.email}">email</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="fw-semibold text-dark" th:text="${#temporals.format(history.workDate, 'dd/MM/yyyy')}"></span>
                                </td>
                                <td>
                                    <span th:if="${history.checkInAt != null}" th:text="${#dates.format(T(java.util.Date).from(history.checkInAt), 'HH:mm')}"></span>
                                    <span th:unless="${history.checkInAt != null}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${history.checkOutAt != null}" th:text="${#dates.format(T(java.util.Date).from(history.checkOutAt), 'HH:mm')}"></span>
                                    <span th:unless="${history.checkOutAt != null}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${history.isActive}" class="badge bg-success-subtle text-success">Đang làm</span>
                                    <span th:unless="${history.isActive}" class="badge bg-secondary-subtle text-secondary">Đã xong</span>
                                </td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${history.totalWorkloadMinutes}"></span>
                                    <span class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill ms-1" style="font-size: 11px;" th:if="${history.otWorkloadMinutes != null and history.otWorkloadMinutes > 0}" th:text="'+ ' + ${history.otWorkloadMinutes} + 'm OT'"></span>
                                </td>
                                <td>
                                    <span class="text-success fw-bold" th:text="${history.completedTasksCount}"></span> / 
                                    <span class="text-muted" th:text="${history.assignedTasksCount}"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(attendances)}">
                                <td colspan="7" class="text-center text-muted py-4">Chưa có dữ liệu điểm danh.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-layout.js}"></script>

</body>
</html>
