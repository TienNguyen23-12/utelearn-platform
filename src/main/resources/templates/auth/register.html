<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/brand/logo-900x900.png">
    <link rel="apple-touch-icon" href="/images/brand/logo-900x900.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - UTELearn LMS Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 16px;
            color: #1e293b;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header {
            padding: 36px 32px 14px;
            text-align: center;
        }
        .brand-logo-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 26px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35);
            margin-bottom: 14px;
        }
        .brand-title {
            color: #0f172a;
            font-weight: 800;
            font-size: 23px;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .brand-title span {
            color: #2563eb;
        }
        .brand-subtitle {
            color: #64748b;
            font-size: 13.5px;
            margin: 0;
        }
        .auth-card-body {
            padding: 16px 32px 36px;
        }
        .form-label {
            color: #334155;
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 6px;
        }
        .input-group {
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .input-group:focus-within {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            border-radius: 12px;
        }
        .input-group-text {
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-right: none;
            color: #64748b;
            border-radius: 12px 0 0 12px !important;
            padding: 12px 14px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control {
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-left: none;
            color: #0f172a;
            border-radius: 0 12px 12px 0 !important;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .input-group.with-toggle .form-control {
            border-right: none !important;
            border-radius: 0 !important;
        }
        .toggle-password-btn {
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-left: none;
            color: #64748b;
            border-radius: 0 12px 12px 0 !important;
            padding: 12px 14px;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-password-btn:hover {
            background-color: #f8fafc;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control,
        .input-group:focus-within .toggle-password-btn {
            border-color: #2563eb;
        }
        .form-control:focus {
            box-shadow: none;
            background-color: #ffffff;
            color: #0f172a;
        }
        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .otp-input {
            letter-spacing: 8px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 14.5px;
            padding: 13px;
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.5);
            color: #ffffff;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 18px;
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider span {
            padding: 0 12px;
        }
        .btn-google {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }
        .btn-google:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            color: #0f172a;
        }
        .auth-footer-links {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13.5px;
        }
        .auth-footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer-links a:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
        .btn-back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
        }
        .btn-back-home:hover {
            background: #1d4ed8;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <a href="/" class="btn-back-home" title="Về trang chủ">
        <i class="bi bi-arrow-left"></i>
    </a>
    <div class="brand-header">
        <a href="/" class="d-inline-block text-decoration-none mb-2">
            <img src="/images/brand/logo-text.png" alt="UTELearn" height="36">
        </a>
        <div class="brand-title fs-5 mt-2">Đăng ký tài khoản</div>
        <p class="brand-subtitle">Trở thành thành viên cộng đồng học tập số HCM-UTE</p>
    </div>

    <div class="auth-card-body">
        <div id="authFlashMessage" th:data-error="${errorMessage}" th:data-success="${successMessage}" style="display: none;"></div>

        <div id="step1Container">
            <form id="step1Form" onsubmit="handleSendOtp(event)">
                <div class="mb-3">
                    <label class="form-label" for="email">Địa chỉ Email <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="vd: vana@utelearn.edu.vn" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group with-toggle">
                        <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="password" tabindex="-1" title="Hiện/ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group with-toggle">
                        <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="confirmPassword" tabindex="-1" title="Hiện/ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100" id="sendOtpBtn">
                    <i class="bi bi-arrow-right-circle-fill"></i>
                    <span>Tiếp tục (Nhận mã OTP)</span>
                </button>
            </form>

            <div class="divider">
                <span>Hoặc</span>
            </div>

            <a th:href="@{/oauth2/authorization/google}" class="btn btn-google w-100">
                <svg width="19" height="19" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Tiếp tục với tài khoản Google</span>
            </a>

            <div class="auth-footer-links">
                Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
            </div>
        </div>

        <div id="step2Container" style="display: none;">
            <div class="text-center mb-3">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-shield-check me-1"></i> Xác minh mã OTP
                </span>
            </div>
            <p class="text-muted text-center small mb-3">
                Mã xác thực gồm 6 chữ số đã được gửi tới <strong id="displayEmail" class="text-dark"></strong>.
            </p>

            <form id="step2Form" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label class="form-label" for="otp">Mã xác thực OTP <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="text" id="otp" name="otp" class="form-control otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required>
                    </div>
                    <div class="text-muted text-end mt-1" style="font-size: 12px;">
                        Mã có hiệu lực trong vòng 5 phút
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100" id="registerBtn">
                    <i class="bi bi-person-check-fill"></i>
                    <span>Xác nhận & Đăng ký</span>
                </button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
                <button type="button" class="btn btn-link text-muted text-decoration-none p-0 small" onclick="goToStep1()">
                    <i class="bi bi-arrow-left"></i> Đổi email/mật khẩu
                </button>
                <button type="button" id="resendOtpBtn" class="btn btn-link text-primary text-decoration-none p-0 small fw-semibold" onclick="handleResendOtp()" disabled>
                    Gửi lại mã (<span id="resendTimer">60</span>s)
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script th:src="@{/js/admin-layout.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const flashEl = document.getElementById('authFlashMessage');
        if (flashEl) {
            const errorMsg = flashEl.getAttribute('data-error');
            const successMsg = flashEl.getAttribute('data-success');
            if (errorMsg) {
                showToast(errorMsg, 'error');
            }
            if (successMsg) {
                showToast(successMsg, 'success');
            }
        }
    });

    let countdownInterval = null;

    function togglePassword(btn) {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }

    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            togglePassword(this);
        });
    });

    function startCountdown(seconds = 60) {
        clearInterval(countdownInterval);
        const resendBtn = document.getElementById('resendOtpBtn');
        let remaining = seconds;
        resendBtn.disabled = true;
        resendBtn.innerHTML = 'Gửi lại mã (<span id="resendTimer">' + remaining + '</span>s)';
        countdownInterval = setInterval(() => {
            remaining--;
            const timerSpan = document.getElementById('resendTimer');
            if (timerSpan) {
                timerSpan.textContent = remaining;
            }
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                resendBtn.disabled = false;
                resendBtn.innerHTML = 'Gửi lại mã OTP';
            }
        }, 1000);
    }

    function goToStep1() {
        document.getElementById('step2Container').style.display = 'none';
        document.getElementById('step1Container').style.display = 'block';
        document.getElementById('email').focus();
    }

    function handleSendOtp(event) {
        if (event) event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!email) {
            showToast('Vui lòng nhập địa chỉ email!', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showToast('Email không đúng định dạng (ví dụ: user@utelearn.edu.vn)', 'error');
            return;
        }

        const isStrong = password.length >= 8 &&
            /[a-z]/.test(password) &&
            /[A-Z]/.test(password) &&
            /[0-9]/.test(password) &&
            /[^a-zA-Z0-9\s]/.test(password);

        if (!isStrong) {
            showToast('Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, chữ số và ký tự đặc biệt!', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showToast('Mật khẩu xác nhận không trùng khớp!', 'error');
            return;
        }

        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const originalHtml = sendOtpBtn.innerHTML;
        sendOtpBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang gửi OTP...';
        sendOtpBtn.disabled = true;

        fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(res => {
            sendOtpBtn.innerHTML = originalHtml;
            sendOtpBtn.disabled = false;
            if (res.success) {
                showToast(res.message, 'success');
                document.getElementById('displayEmail').textContent = email;
                document.getElementById('step1Container').style.display = 'none';
                document.getElementById('step2Container').style.display = 'block';
                document.getElementById('otp').value = '';
                document.getElementById('otp').focus();
                startCountdown(60);
            } else {
                showToast(res.message || 'Không thể gửi mã OTP', 'error');
            }
        })
        .catch(error => {
            sendOtpBtn.innerHTML = originalHtml;
            sendOtpBtn.disabled = false;
            showToast('Đã xảy ra lỗi khi gửi mã OTP. Vui lòng thử lại sau!', 'error');
        });
    }

    function handleResendOtp() {
        const email = document.getElementById('email').value.trim();
        if (!email) {
            goToStep1();
            return;
        }
        const resendBtn = document.getElementById('resendOtpBtn');
        resendBtn.disabled = true;
        resendBtn.textContent = 'Đang gửi...';

        fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(res => {
            if (res.success) {
                showToast('Đã gửi lại mã OTP mới đến email của bạn!', 'success');
                document.getElementById('otp').value = '';
                document.getElementById('otp').focus();
                startCountdown(60);
            } else {
                showToast(res.message || 'Gửi lại mã OTP thất bại', 'error');
                resendBtn.disabled = false;
                resendBtn.textContent = 'Gửi lại mã OTP';
            }
        })
        .catch(error => {
            showToast('Đã xảy ra lỗi kết nối khi gửi lại mã OTP', 'error');
            resendBtn.disabled = false;
            resendBtn.textContent = 'Gửi lại mã OTP';
        });
    }

    function handleRegister(event) {
        if (event) event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const otp = document.getElementById('otp').value.trim();

        if (!otp || otp.length !== 6) {
            showToast('Vui lòng nhập đúng mã OTP gồm 6 chữ số!', 'error');
            return;
        }

        const registerBtn = document.getElementById('registerBtn');
        const originalBtnHtml = registerBtn.innerHTML;
        registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang xác thực...';
        registerBtn.disabled = true;

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                password: password,
                confirmPassword: confirmPassword,
                otp: otp
            })
        })
        .then(response => response.json())
        .then(res => {
            if (res.success) {
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = res.redirectUrl;
                }, 1200);
            } else {
                showToast(res.message || 'Đăng ký thất bại', 'error');
                registerBtn.innerHTML = originalBtnHtml;
                registerBtn.disabled = false;
            }
        })
        .catch(error => {
            showToast('Đã xảy ra lỗi khi hoàn tất đăng ký.', 'error');
            registerBtn.innerHTML = originalBtnHtml;
            registerBtn.disabled = false;
        });
    }
</script>
</body>
</html>
