<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - UTELearn LMS Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 16px;
            color: #1e293b;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header {
            padding: 36px 32px 16px;
            text-align: center;
        }
        .brand-logo-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35);
            margin-bottom: 14px;
        }
        .brand-title {
            color: #0f172a;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .brand-subtitle {
            color: #64748b;
            font-size: 13.5px;
            line-height: 1.5;
            margin: 0;
        }
        .auth-card-body { padding: 16px 32px 36px; }
        .form-label {
            color: #334155;
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 6px;
        }
        .input-group { border-radius: 12px; transition: all 0.2s ease; }
        .input-group:focus-within { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); border-radius: 12px; }
        .input-group-text {
            background-color: #f8fafc; border: 1.5px solid #cbd5e1; border-right: none; color: #64748b;
            border-radius: 12px 0 0 12px !important; padding: 12px 14px; font-size: 15px; transition: border-color 0.2s;
        }
        .form-control {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; border-left: none; color: #0f172a;
            border-radius: 0 12px 12px 0 !important; padding: 12px 14px; font-size: 14px; font-weight: 500; transition: border-color 0.2s;
        }
        .input-group:focus-within .input-group-text, .input-group:focus-within .form-control { border-color: #2563eb; }
        .form-control:focus { box-shadow: none; background-color: #ffffff; color: #0f172a; }
        .form-control::placeholder { color: #94a3b8; font-weight: 400; }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); border: none; color: #ffffff; font-weight: 600; font-size: 14.5px;
            padding: 13px; border-radius: 12px; transition: all 0.25s ease; box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary-gradient:hover { background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); transform: translateY(-1px); box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.5); color: #ffffff; }
        .auth-footer-links { text-align: center; margin-top: 22px; color: #64748b; font-size: 13.5px; }
        .auth-footer-links a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .auth-footer-links a:hover { text-decoration: underline; color: #1d4ed8; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <div class="brand-logo-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="brand-title">Quên mật khẩu</div>
        <p class="brand-subtitle">Nhập email của bạn, chúng tôi sẽ gửi link đặt lại mật khẩu cho bạn.</p>
    </div>

    <div class="auth-card-body">
        <!-- Hiển thị thông báo bằng Toastify thay vì Alert tĩnh -->
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                var errorMsg = /*[[${errorMessage}]]*/ null;
                var successMsg = /*[[${successMessage}]]*/ null;
                
                if (errorMsg) {
                    showToast(errorMsg, 'error');
                }
                if (successMsg) {
                    showToast(successMsg, 'success');
                }
            });
        </script>

        <form id="ajaxForgotForm" onsubmit="handleForgot(event)">
            <div class="mb-4">
                <label class="form-label" for="email">Địa chỉ Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Nhập email của bạn..." required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100" id="forgotBtn">
                <i class="bi bi-send-fill"></i>
                <span>Gửi link đặt lại mật khẩu</span>
            </button>
        </form>

        <div class="auth-footer-links">
            Nhớ ra mật khẩu? <a th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
                    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    function handleForgot(event) {
        event.preventDefault();
        
        const form = document.getElementById('ajaxForgotForm');
        const btn = document.getElementById('forgotBtn');
        const originalBtnHtml = btn.innerHTML;
        
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang gửi...';
        btn.disabled = true;

        const data = {
            email: form.email.value
        };

        fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(res => {
            if (res.success) {
                showToast(res.message, 'success');
                form.reset();
            } else {
                showToast(res.message || 'Thao tác thất bại', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showToast('Đã xảy ra lỗi khi gọi API.', 'error');
        })
        .finally(() => {
            btn.innerHTML = originalBtnHtml;
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
