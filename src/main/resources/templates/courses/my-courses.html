<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học của tôi - UTELearn LMS Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Admin Master Layout CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>

<body>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Master Sidebar Fragment -->
    <aside th:replace="~{fragments/sidebar :: sidebar('my_courses')}"></aside>

    <!-- Master Content Wrapper -->
    <div class="app-content-wrapper">
        <!-- Top Navbar Fragment -->
        <header th:replace="~{fragments/navbar :: navbar('Khóa học của tôi')}"></header>

        <!-- Main Content Area -->
        <main class="app-main-content">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                    <h5 class="fw-bold text-dark mb-1">
                        <i class="bi bi-journal-check text-primary me-2"></i>Các khóa học đã tham gia
                    </h5>
                    <p class="text-muted small mb-0">Tiếp tục hành trình học tập của bạn</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${myCourses == null || myCourses.isEmpty()}" class="text-center py-5 text-muted">
                        <i class="bi bi-folder-x display-4 mb-3 d-block text-secondary opacity-50"></i>
                        <h6>Bạn chưa tham gia khóa học nào.</h6>
                        <a href="/courses" class="btn btn-outline-primary rounded-pill mt-3 px-4">Khám phá khóa học</a>
                    </div>
                    <div th:if="${myCourses != null && !myCourses.isEmpty()}" class="row g-4">
                        <div th:each="cohortMember : ${myCourses}" class="col-md-6 col-lg-4">
                            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden"
                                style="transition: transform 0.2s;">
                                <div class="position-relative">
                                    <img th:src="${cohortMember.cohort.course.thumbnailUrl != null ? cohortMember.cohort.course.thumbnailUrl : 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80'}"
                                        class="card-img-top" alt="Course thumbnail"
                                        style="height: 160px; object-fit: cover;">
                                    <span
                                        class="position-absolute top-0 start-0 m-2 badge bg-dark bg-opacity-75 text-white"
                                        th:text="${cohortMember.cohort.name}">Đợt học</span>
                                </div>
                                <div class="card-body p-3 d-flex flex-column">
                                    <h6 class="card-title fw-bold text-dark mb-1"
                                        th:text="${cohortMember.cohort.course.title}">Course Title</h6>
                                    <p class="text-muted small mb-3">
                                        <i class="bi bi-person-circle me-1"></i><span
                                            th:text="${cohortMember.cohort.course.createdBy != null ? cohortMember.cohort.course.createdBy.fullName : 'Giảng viên'}">Giảng
                                            viên</span>
                                        <br>
                                        <i class="bi bi-tag-fill me-1"></i><span
                                            th:text="${cohortMember.cohort.code}">Mã Lớp</span>
                                    </p>
                                    <div class="mt-auto d-flex justify-content-between align-items-center">
                                        <span class="badge bg-primary-subtle text-primary small">
                                            Điểm: <span
                                                th:text="${cohortMember.finalGrade != null ? cohortMember.finalGrade : 'Chưa có'}">0</span>
                                        </span>
                                        <a th:href="@{'/courses/' + ${cohortMember.cohort.course.slug} + '/learn'}"
                                            class="btn btn-sm btn-primary rounded-pill px-3">
                                            Tiếp tục học
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Custom JS -->
    <script th:src="@{/js/admin-layout.js}"></script>
</body>

</html>
