<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/brand/UTELearn_SquareLogo_2.png">
    <link rel="apple-touch-icon" href="/images/brand/UTELearn_SquareLogo_2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học - UTELearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

    <style>
        html {
            overflow-y: scroll;
        }
        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }
        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand-title span {
            color: #2563eb;
        }
        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }
        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .filter-sidebar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
        }
        .filter-title {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item {
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            color: #475569;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        .filter-item:hover {
            background: #eff6ff;
            color: #2563eb;
        }
        .filter-item.active {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 700;
        }

        .course-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
        }
        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }
        .course-image-wrapper {
            height: 190px;
            position: relative;
            overflow: hidden;
        }
        .course-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .course-card:hover .course-image-wrapper img {
            transform: scale(1.05);
        }
        .cohort-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .course-wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            transition: all 0.2s ease;
            z-index: 3;
            cursor: pointer;
            padding: 0;
        }
        .course-wishlist-btn:hover {
            background: #ffffff;
            transform: scale(1.1);
            color: #dc2626;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
        }
        .course-wishlist-btn:active {
            transform: scale(0.95);
        }

        .skeleton {
            background: #e2e8f0;
            border-radius: 4px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: siteNavbar('courses')}"></nav>

<section class="container my-5 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
        <div>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1 mb-2 fw-bold" style="font-size: 11px;">
                LỘ TRÌNH ĐÀO TẠO TOÀN DIỆN
            </span>
            <h2 class="fw-bold text-dark mb-0">Khám phá Khóa học</h2>
            <p class="text-muted mt-2 mb-0">Tìm kiếm và lựa chọn lộ trình đào tạo chuẩn hóa, bài bản và chuyên sâu.</p>
        </div>
        <div class="input-group input-group-sm mt-3 mt-md-0" style="max-width: 380px;">
            <input type="text" id="searchInput" class="form-control border rounded-start-pill ps-3" placeholder="Tìm tên khóa học, kỹ năng...">
            <button class="btn btn-primary rounded-end-pill px-3" onclick="currentFilters.q = document.getElementById('searchInput').value; loadCourses(0);"><i class="bi bi-search"></i></button>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="filter-sidebar">
                <div class="filter-title">
                    <i class="bi bi-grid-fill text-primary"></i>
                    <span>Danh mục</span>
                </div>
                <div id="categoryList">
                    <div class="skeleton" style="height: 20px; width: 80%; margin-bottom: 10px;"></div>
                    <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 10px;"></div>
                </div>

                <hr class="my-4 text-muted">

                <div class="filter-title">
                    <i class="bi bi-bar-chart-fill text-primary"></i>
                    <span>Cấp độ</span>
                </div>
                <div id="levelList">
                    <div class="filter-item active" onclick="setFilter('level', 'ALL_LEVELS', this)">Tất cả cấp độ</div>
                    <div class="filter-item" onclick="setFilter('level', 'BEGINNER', this)">Người mới bắt đầu</div>
                    <div class="filter-item" onclick="setFilter('level', 'INTERMEDIATE', this)">Trung bình</div>
                    <div class="filter-item" onclick="setFilter('level', 'ADVANCED', this)">Nâng cao</div>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="small text-muted" id="coursesCountSummary">Đang tải danh sách...</span>
                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted text-nowrap" for="pageSizeSelect">Hiển thị:</label>
                    <select id="pageSizeSelect" class="form-select form-select-sm rounded-pill border" style="width: auto;" onchange="handleCoursePageSizeChange(this.value)">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
            <div class="row g-4" id="courseGrid">
                <div class="col-md-6 col-lg-4" th:each="i : ${#numbers.sequence(1, 10)}">
                    <div class="course-card">
                        <div class="skeleton" style="height: 190px;"></div>
                        <div class="p-4 d-flex flex-column flex-grow-1">
                            <div class="d-flex justify-content-between mb-2">
                                <div class="skeleton rounded-pill" style="height: 22px; width: 35%;"></div>
                                <div class="skeleton rounded-pill" style="height: 22px; width: 25%;"></div>
                            </div>
                            <div class="skeleton mb-2" style="height: 14px; width: 50%;"></div>
                            <div class="skeleton mb-2" style="height: 20px; width: 85%;"></div>
                            <div class="skeleton mb-2" style="height: 14px; width: 40%;"></div>
                            <div class="skeleton mb-3" style="height: 16px; width: 60%;"></div>
                            <div class="skeleton pt-3 border-top mt-auto" style="height: 18px; width: 100%;"></div>
                            <div class="skeleton mt-2 mx-auto" style="height: 20px; width: 50%;"></div>
                            <div class="mt-3 w-100">
                                <div class="skeleton rounded-pill" style="height: 34px; width: 100%;"></div>
                                <div class="skeleton rounded-pill mt-2" style="height: 34px; width: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="coursesPaginationNav" class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2 px-1"></div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    let currentFilters = {
        q: '',
        category: '',
        level: 'ALL_LEVELS'
    };

    let nextCursor = null;
    let hasNextCourse = false;
    let courseObserver = null;

    function debounce(fn, delay = 350) {
        let timer = null;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    let isCourseLoading = false;
    let isCourseLoadingMore = false;

    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('q')) {
            currentFilters.q = urlParams.get('q');
            document.getElementById('searchInput').value = urlParams.get('q');
        }
        if (urlParams.has('category')) {
            currentFilters.category = urlParams.get('category');
        }
        loadCategories();
        

        const debouncedCourseSearch = debounce((val) => {
            currentFilters.q = val;
            loadCourses();
        }, 350);

        const savedPageSize = localStorage.getItem('utelearn_catalog_page_size');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        if (savedPageSize && pageSizeSelect) {
            pageSizeSelect.value = savedPageSize;
        }
        if (pageSizeSelect) {
            pageSizeSelect.addEventListener('change', () => {
                handleCoursePageSizeChange(pageSizeSelect.value);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            debouncedCourseSearch(this.value);
        });

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                currentFilters.q = this.value;
                isCourseLoading = false;
        loadCourses(0);
            }
        });

        isCourseLoading = false;
        loadCourses(0);
    });

    function handleCoursePageSizeChange(val) {
        localStorage.setItem('utelearn_catalog_page_size', val);
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        if (pageSizeSelect && pageSizeSelect.value !== val) {
            pageSizeSelect.value = val;
        }
        isCourseLoading = false;
        loadCourses(0);
    }

    function setFilter(type, value, element) {
        currentFilters[type] = value;
        let parent = element.parentElement;
        parent.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        isCourseLoading = false;
        loadCourses(0);
    }

    async function loadCategories() {
        try {
            const res = await fetch('/api/courses/categories');
            const categories = await res.json();
            const list = document.getElementById('categoryList');
            const isAllActive = !currentFilters.category ? 'active' : '';
            let html = `<div class="filter-item ${isAllActive}" onclick="setFilter('category', '', this)">Tất cả danh mục</div>`;
            categories.forEach(cat => {
                const isActive = currentFilters.category === cat.slug ? 'active' : '';
                html += `<div class="filter-item ${isActive}" onclick="setFilter('category', '${cat.slug}', this)">${cat.name}</div>`;
            });
            list.innerHTML = html;
        } catch (error) {
            console.error("Error loading categories", error);
        }
    }

    function createCourseCardHtml(course) {
        const img = course.thumbnailUrl || '/images/courses/default-cover.png';
        const priceFormatted = (course.price && course.price > 0)
            ? new Intl.NumberFormat('vi-VN').format(course.price) + ' VNĐ'
            : 'Miễn phí';

        const originalFormatted = (course.originalPrice && course.originalPrice > course.price)
            ? new Intl.NumberFormat('vi-VN').format(course.originalPrice) + ' VNĐ'
            : null;

        let levelBadgeText = 'Tất cả cấp độ';
        if (course.level === 'BEGINNER') levelBadgeText = 'Người mới bắt đầu';
        else if (course.level === 'INTERMEDIATE') levelBadgeText = 'Trung bình';
        else if (course.level === 'ADVANCED') levelBadgeText = 'Nâng cao';

        const typeBadge = (course.price && course.price > 0)
            ? '<span class="badge bg-primary-subtle text-primary ms-2 border border-primary-subtle">Trọn gói</span>'
            : '<span class="badge bg-success-subtle text-success ms-2 border border-success-subtle">Miễn phí</span>';

        const modulesLabel = (course.modulesCount && course.modulesCount > 0)
            ? course.modulesCount + ' Module học phần'
            : 'Trọn bộ bài giảng';

        const isAdmin = course.isAdmin === true;
        let badgeHtml = '';
        if (isAdmin) {
            badgeHtml = '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-shield-lock-fill me-1"></i>Quản trị viên</span>';
        } else if (course.isOwner) {
            badgeHtml = '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-person-badge-fill me-1"></i>Khóa của bạn</span>';
        } else if (course.isEnrolled) {
            badgeHtml = '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-check-circle-fill me-1"></i>Đã sở hữu</span>';
        } else if (course.isCourseInCart) {
            badgeHtml = '<span class="badge bg-info-subtle text-info border border-info-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-cart3 me-1"></i>Đã trong giỏ</span>';
        } else if (course.isPartiallyEnrolled) {
            badgeHtml = `<span class="badge bg-info-subtle text-info border border-info-subtle rounded-pill px-2 py-0.5 small fw-semibold">Đã học ${course.userEnrolledCohortsCount}/${course.modulesCount} phần</span>`;
        } else {
            badgeHtml = typeBadge;
        }

        return `
        <div class="col-12 col-md-6 col-lg-4 mb-4">
            <div class="course-card h-100 d-flex flex-column">
                <div class="course-image-wrapper position-relative">
                    <img src="${img}" alt="${course.title}" loading="lazy">
                    <span class="cohort-badge"><i class="bi bi-mortarboard-fill me-1"></i>${levelBadgeText}</span>
                    <button type="button" class="course-wishlist-btn" title="Lưu vào yêu thích" onclick="toggleCatalogWishlist(event, ${course.id}, this)">
                        <i class="${course.inWishlist ? 'bi bi-heart-fill text-danger' : 'bi bi-heart text-danger'}" style="font-size: 13.5px;"></i>
                    </button>
                </div>
                <div class="p-3.5 d-flex flex-column flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-light text-primary border rounded-pill px-2.5 py-1 small fw-semibold">${course.categoryName || 'Khóa học'}</span>
                        ${badgeHtml}
                    </div>
                    <h6 class="fw-bold text-dark mb-2 lh-base line-clamp-2" title="${course.title}" style="min-height: 44px;">
                        <a href="/courses/${course.slug}" class="text-dark text-decoration-none course-title-link">${course.title}</a>
                    </h6>
                    <div class="text-muted small mb-2 d-flex align-items-center gap-1">
                        <i class="bi bi-person-circle text-secondary"></i>
                        <span class="text-truncate">${course.instructorName || 'Ban Giảng viên'}</span>
                    </div>
                    <div class="d-flex align-items-center gap-1 mb-3">
                        ${renderRatingHtml(course.rating, course.ratingCount)}
                    </div>
                    <div class="mt-auto pt-3 border-top d-flex align-items-center justify-content-between gap-2">
                        <div class="d-flex flex-column text-nowrap">
                            ${originalFormatted ? `<small class="text-muted text-decoration-line-through lh-1" style="font-size: 11px;">${originalFormatted}</small>` : ''}
                            <span class="fw-bold text-success fs-6 lh-1 mt-0.5">${priceFormatted}</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-shrink-0">
                            ${(!course.isEnrolled && !course.isOwner) ? `
                            <button type="button" class="btn btn-sm btn-outline-primary rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; flex-shrink: 0;" title="${course.isCourseInCart ? 'Đã trong giỏ' : 'Thêm vào giỏ'}" onclick="addToCartCatalog(event, 'COURSE', ${course.id})">
                                <i class="bi ${course.isCourseInCart ? 'bi-cart-check-fill' : 'bi-cart-plus'}" style="font-size: 14px;"></i>
                            </button>
                            ` : ''}
                            <a href="/courses/${course.slug}" class="btn btn-sm ${course.isEnrolled ? 'btn-success' : (isAdmin ? 'btn-outline-warning' : (course.isOwner ? 'btn-warning' : 'btn-outline-primary'))} rounded-pill px-3 py-1.5 fw-semibold shadow-xs text-nowrap">
                                ${isAdmin ? '<i class="bi bi-gear-fill me-1"></i>Quản trị' : (course.isOwner ? 'Giảng dạy' : (course.isEnrolled ? '<i class="bi bi-play-circle-fill me-1"></i>Vào học' : 'Xem chi tiết'))}
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        `;
    }

    function renderRatingHtml(rating, ratingCount) {
        const count = (ratingCount && ratingCount > 0) ? Number(ratingCount) : 0;
        if (count === 0 || !rating) {
            return `
                <span class="d-inline-flex align-items-center text-muted" style="gap: 2px; font-size: 12px;">
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                    <span class="ms-1" style="font-size: 11.5px;">(Chưa có đánh giá)</span>
                </span>
            `;
        }

        const score = Number(rating);
        const formattedScore = score.toFixed(1);

        let stars = '';
        for (let i = 1; i <= 5; i++) {
            if (score >= i) {
                stars += '<i class="bi bi-star-fill text-warning"></i>';
            } else if (score >= i - 0.5) {
                stars += '<i class="bi bi-star-half text-warning"></i>';
            } else {
                stars += '<i class="bi bi-star text-muted"></i>';
            }
        }

        return `
            <span class="fw-bold text-dark me-1" style="font-size: 13px;">${formattedScore}</span>
            <span class="d-inline-flex align-items-center" style="gap: 2px; font-size: 12px;">${stars}</span>
            <span class="text-muted small ms-1" style="font-size: 11.5px;">(${count} đánh giá)</span>
        `;
    }

    let currentCoursePage = 0;
    let totalCoursePages = 1;

    async function fetchCoursesPage(page = 0) {
        const params = new URLSearchParams();
        if (currentFilters.q) params.append('q', currentFilters.q.trim());
        if (currentFilters.category) params.append('category', currentFilters.category);
        if (currentFilters.level && currentFilters.level !== 'ALL_LEVELS') params.append('level', currentFilters.level);
        params.append('page', page);
        const pageSizeEl = document.getElementById('pageSizeSelect');
        const pageSize = pageSizeEl ? pageSizeEl.value : '10';
        params.append('size', pageSize);

        const res = await fetch('/api/courses?' + params.toString());
        if (!res.ok) throw new Error("Failed to fetch");
        return await res.json();
    }

    let currentCourseItems = [];
    let currentCourseRenderedCount = 0;
    const COURSE_CHUNK_SIZE = 3;
    let courseScrollObserver = null;

    async function loadCourses(page = 0) {
        if (isCourseLoading) return;
        isCourseLoading = true;
        currentCoursePage = page;

        if (courseScrollObserver) {
            courseScrollObserver.disconnect();
        }

        const grid = document.getElementById('courseGrid');
        const paginationNav = document.getElementById('coursesPaginationNav');
        if (paginationNav) paginationNav.innerHTML = '';
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Đang tải danh sách khóa học...</p></div>';

        try {
            const data = await fetchCoursesPage(currentCoursePage);
            totalCoursePages = data.totalPages != null ? data.totalPages : 1;
            const totalItems = data.totalItems != null ? data.totalItems : 0;
            const countSummaryEl = document.getElementById('coursesCountSummary');
            if (countSummaryEl) {
                countSummaryEl.textContent = totalItems > 0 ? 'Tìm thấy ' + totalItems + ' khóa học' : '0 khóa học';
            }

            if (!data.content || data.content.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><p class="mt-2">Không tìm thấy khóa học nào phù hợp.</p></div>';
                return;
            }

            currentCourseItems = data.content;
            currentCourseRenderedCount = 0;
            grid.innerHTML = '';

            renderNextCourseChunk();
            renderCoursePagination(data.currentPage, totalCoursePages, totalItems);
        } catch (error) {
            grid.innerHTML = `
                <div class="col-12 text-center text-danger py-5">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                    <p class="mt-2">Có lỗi xảy ra khi tải danh sách khóa học.</p>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="loadCourses(currentCoursePage)">
                        <i class="bi bi-arrow-clockwise me-1"></i>Thử lại
                    </button>
                </div>
            `;
        } finally {
            isCourseLoading = false;
        }
    }

    function renderNextCourseChunk() {
        const grid = document.getElementById('courseGrid');
        if (!grid) return;

        let sentinel = document.getElementById('courseLazySentinel');
        if (sentinel) sentinel.remove();

        const nextEnd = Math.min(currentCourseRenderedCount + COURSE_CHUNK_SIZE, currentCourseItems.length);
        let chunkHtml = '';
        for (let i = currentCourseRenderedCount; i < nextEnd; i++) {
            chunkHtml += createCourseCardHtml(currentCourseItems[i]);
        }
        grid.insertAdjacentHTML('beforeend', chunkHtml);
        currentCourseRenderedCount = nextEnd;

        if (currentCourseRenderedCount < currentCourseItems.length) {
            const sentinelHtml = `
                <div id="courseLazySentinel" class="col-12 text-center py-4 my-2">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span class="small text-muted ms-2">Đang cuộn để tải thêm các khóa học còn lại của trang...</span>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', sentinelHtml);
            sentinel = document.getElementById('courseLazySentinel');

            if (courseScrollObserver) courseScrollObserver.disconnect();
            courseScrollObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    courseScrollObserver.disconnect();
                    setTimeout(() => {
                        renderNextCourseChunk();
                    }, 150);
                }
            }, { rootMargin: '120px' });
            courseScrollObserver.observe(sentinel);
        }
    }

    function renderCoursePagination(currPage, totalPages, totalItems) {
        const nav = document.getElementById('coursesPaginationNav');
        if (!nav) return;

        if (totalPages <= 1) {
            nav.innerHTML = `
                <span class="small text-muted">Trang 1 / 1 (Tổng số ${totalItems} khóa học)</span>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item disabled"><span class="page-link rounded-pill px-3 me-1">Trước</span></li>
                    <li class="page-item active"><span class="page-link rounded-pill px-2.5 mx-0.5">1</span></li>
                    <li class="page-item disabled"><span class="page-link rounded-pill px-3 ms-1">Sau</span></li>
                </ul>
            `;
            return;
        }

        const displayPage = currPage + 1;
        let btnsHtml = `
            <span class="small text-muted">Trang ${displayPage} / ${totalPages} (Tổng số ${totalItems} khóa học)</span>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item ${currPage === 0 ? 'disabled' : ''}">
                    <button type="button" class="page-link rounded-pill px-3 me-1" data-page="${currPage - 1}">Trước</button>
                </li>
        `;

        for (let p = 1; p <= totalPages; p++) {
            if (totalPages > 7 && Math.abs(p - displayPage) > 2 && p !== 1 && p !== totalPages) {
                if (p === 2 || p === totalPages - 1) {
                    btnsHtml += `<li class="page-item disabled"><span class="page-link border-0">...</span></li>`;
                }
                continue;
            }
            btnsHtml += `
                <li class="page-item ${p === displayPage ? 'active' : ''}">
                    <button type="button" class="page-link rounded-pill px-2.5 mx-0.5" data-page="${p - 1}">${p}</button>
                </li>
            `;
        }

        btnsHtml += `
                <li class="page-item ${currPage >= totalPages - 1 ? 'disabled' : ''}">
                    <button type="button" class="page-link rounded-pill px-3 ms-1" data-page="${currPage + 1}">Sau</button>
                </li>
            </ul>
        `;
        nav.innerHTML = btnsHtml;

        nav.querySelectorAll('button[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                const pageNum = Number(btn.dataset.page);
                loadCourses(pageNum);
                document.getElementById('courseGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });
    }

    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    function notifyOjPhase2(event) {
        if (event) {
            event.preventDefault();
        }
        showToast('Tính năng Luyện thi Online Judge đang được hoàn thiện trong tương lai!', 'warning');
    }
async function addToCartCatalog(event, itemType, itemId) {
    if (event) {
        event.stopPropagation();
    }
    try {
        const params = new URLSearchParams();
        params.append('itemType', itemType);
        params.append('itemId', itemId);
        const res = await fetch('/cart/add', {
            method: 'POST',
            body: params,
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            }
        });
        const data = await res.json();
        if (res.status === 401) {
            window.location.href = '/login';
            return;
        }
        if (data.success) {
            showToast(data.message, 'success');
            const badges = document.querySelectorAll('.nav-cart-badge');
            badges.forEach(badge => {
                badge.textContent = data.cartItemCount;
                if (data.cartItemCount > 0) {
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }
            });
        } else {
            showToast(data.message || 'Không thể thêm vào giỏ hàng.', 'warning');
        }
    } catch (e) {
        console.error(e);
        showToast('Có lỗi xảy ra khi thêm vào giỏ hàng.', 'error');
    }
}

async function toggleCatalogWishlist(event, courseId, btn) {
    event.stopPropagation();
    try {
        const res = await fetch('/api/wishlist/toggle/' + courseId, { method: 'POST' });
        const data = await res.json();
        if (res.status === 401) {
            window.location.href = '/login';
            return;
        }
        if (data.success) {
            const icon = btn.querySelector('i');
            if (data.inWishlist) {
                icon.className = 'bi bi-heart-fill text-danger';
            } else {
                icon.className = 'bi bi-heart text-danger';
            }
            showToast(data.message, 'success');
        }
    } catch (e) {
        console.error(e);
    }
}
</script>
