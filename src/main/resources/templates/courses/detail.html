<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học - UTELearn</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        html {
            overflow-y: scroll;
        }
        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* Navbar */
        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }
        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand-title span {
            color: #2563eb;
        }
        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }
        
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 60px 0;
            position: relative;
        }
        .content-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }
        .enroll-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
            position: sticky;
            top: 90px;
        }
        .enroll-img { width: 100%; height: 220px; object-fit: cover; }
        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/site-navbar :: siteNavbar('courses')}"></nav>

<div id="appContainer">
    <div class="text-center py-5 my-5 text-muted">
        <div class="spinner-border text-primary fs-4 mb-3"></div>
        <h5>Đang tải dữ liệu khóa học...</h5>
    </div>
</div>

<script th:inline="javascript">
    const slug = /*[[${courseSlug}]]*/ 'default-slug';
    const isEnrolled = /*[[${isEnrolled != null ? isEnrolled : false}]]*/ false;
    const hasAccessRole = /*[[${hasAccessRole != null ? hasAccessRole : false}]]*/ false;
    const canViewContent = isEnrolled || hasAccessRole;

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/courses/' + slug);
            if (!res.ok) throw new Error("Khóa học không tồn tại");
            const course = await res.json();
            
            const img = course.thumbnailUrl || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80';
            let objectivesHtml = '';
            if (course.objectives && course.objectives !== '[]') {
                try {
                    const objArr = JSON.parse(course.objectives);
                    if (objArr.length > 0) {
                        objectivesHtml = '<h5 class="fw-bold mb-3">Bạn sẽ học được gì?</h5><div class="row g-2 mb-4">';
                        objArr.forEach(item => {
                            objectivesHtml += `<div class="col-md-6 d-flex gap-2"><i class="bi bi-check-circle-fill text-success mt-1"></i><span>${item.value || item}</span></div>`;
                        });
                        objectivesHtml += '</div>';
                    }
                } catch(e) {}
            }

            let introHtml = `
                ${objectivesHtml}
                <h5 class="fw-bold mb-3">Mô tả khóa học</h5>
                <div class="text-muted" style="line-height: 1.7;">
                    ${course.description || 'Chưa có mô tả chi tiết.'}
                </div>
            `;

            let curriculumHtml = '';
            if (course.curriculum && course.curriculum.length > 0) {
                curriculumHtml = `
                    <h5 class="fw-bold mt-5 mb-3">Nội dung khóa học</h5>
                    <div class="accordion mb-4" id="curriculumAccordion">
                `;
                course.curriculum.forEach((item, index) => {
                    let lessonsHtml = '';
                    if (item.lessons && item.lessons.length > 0) {
                        item.lessons.forEach(lesson => {
                            let icon = 'bi-file-earmark-text';
                            if (lesson.lessonType === 'VIDEO') icon = 'bi-play-circle-fill text-primary';
                            else if (lesson.lessonType === 'DOCUMENT') icon = 'bi-file-earmark-text-fill text-success';
                            else if (lesson.lessonType === 'QUIZ') icon = 'bi-question-circle-fill text-warning';
                            else if (lesson.lessonType === 'CODE_PRACTICE') icon = 'bi-code-slash text-info';
                            else if (lesson.lessonType === 'ANNOUNCEMENT') icon = 'bi-megaphone-fill text-danger';
                            
                            let badge = '';
                            if (lesson.isLocked) {
                                badge = '<span class="badge bg-secondary-subtle text-secondary ms-auto" style="font-size: 11px;"><i class="bi bi-lock-fill me-1"></i> Đã khóa</span>';
                            } else if (lesson.isFreePreview) {
                                badge = '<span class="badge bg-success-subtle text-success ms-auto" style="font-size: 11px;">Học thử</span>';
                            }
                            
                            let contentHtml = '';
                            let actionsHtml = '';
                            
                            if (canViewContent || lesson.isFreePreview) {
                                if (lesson.documentContent) {
                                    contentHtml += `<div class="mt-2 text-dark small bg-white border p-3 rounded shadow-sm" style="white-space: pre-wrap;">${lesson.documentContent}</div>`;
                                }
                                if (lesson.videoUrl) {
                                    actionsHtml += `<a href="${lesson.videoUrl}" target="_blank" class="btn btn-sm btn-primary me-2"><i class="bi bi-play-circle me-1"></i>Xem Video</a>`;
                                }
                                if (lesson.assetUrl) {
                                    actionsHtml += `<a href="${lesson.assetUrl}" target="_blank" class="btn btn-sm btn-outline-success"><i class="bi bi-download me-1"></i>Tài liệu đính kèm</a>`;
                                }
                            } else {
                                actionsHtml += `<span class="small text-muted fst-italic"><i class="bi bi-lock-fill me-1"></i>Vui lòng tham gia khóa học để xem nội dung</span>`;
                            }

                            if (actionsHtml) {
                                contentHtml += `<div class="mt-2">${actionsHtml}</div>`;
                            }
                            
                            lessonsHtml += `
                                <li class="list-group-item p-3 border-0 border-bottom bg-transparent">
                                    <div class="d-flex align-items-center">
                                        <i class="bi ${icon} fs-5 me-3"></i>
                                        <span class="fw-medium">${lesson.title}</span>
                                        ${badge}
                                    </div>
                                    ${contentHtml ? `<div class="ms-5 mt-2">${contentHtml}</div>` : ''}
                                </li>
                            `;
                        });
                    } else {
                        lessonsHtml = '<li class="list-group-item text-muted small p-3 text-center border-0 border-bottom">Chương này chưa có bài học nào.</li>';
                    }

                    curriculumHtml += `
                        <div class="accordion-item border-0 rounded-3 mb-2 shadow-sm overflow-hidden">
                            <h2 class="accordion-header" id="heading${index}">
                                <button class="accordion-button bg-light fw-bold ${index !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                                    ${item.section.title}
                                </button>
                            </h2>
                            <div id="collapse${index}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}">
                                <div class="accordion-body p-0">
                                    <ul class="list-group list-group-flush">
                                        ${lessonsHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                });
                curriculumHtml += `</div>`;
            }

            let enrollFormHtml = '';
            if (isEnrolled) {
                enrollFormHtml = `<a href="/courses/${slug}/learn" class="btn btn-gradient w-100 rounded-pill mb-3">Vào học ngay</a>`;
            } else {
                enrollFormHtml = `
                    <form action="/courses/${slug}/enroll" method="post">
                        <button type="submit" class="btn btn-gradient w-100 rounded-pill mb-3">Tham gia ngay</button>
                    </form>
                `;
            }

            let mainLayoutHtml = '';
            if (hasAccessRole) {
                // Approval layout: 2/3 curriculum on left, 1/3 intro on right
                mainLayoutHtml = `
                    <div class="col-lg-8">
                        <div class="content-card">
                            ${curriculumHtml}
                        </div>
                    </div>
                    <div class="col-lg-4 mt-4 mt-lg-0" style="margin-top: -120px !important;">
                        <div class="enroll-card mb-4 border-0 shadow-sm rounded-4 overflow-hidden">
                            <img src="${img}" class="enroll-img w-100" style="height: 220px; object-fit: cover;" alt="Course Image">
                        </div>
                        <div class="content-card p-4">
                            ${introHtml}
                        </div>
                    </div>
                `;
            } else {
                // Standard Student layout
                mainLayoutHtml = `
                    <div class="col-lg-8">
                        <div class="content-card">
                            ${introHtml}
                            ${curriculumHtml}
                        </div>
                    </div>
                    <div class="col-lg-4 mt-4 mt-lg-0" style="margin-top: -120px !important;">
                        <div class="enroll-card">
                            <img src="${img}" class="enroll-img" alt="Course Image">
                            <div class="p-4">
                                <h4 class="fw-bold text-center mb-3">Miễn phí</h4>
                                ${enrollFormHtml}
                                <div class="text-center small text-muted">${isEnrolled ? 'Tiếp tục hành trình học tập' : 'Bắt đầu học ngay hôm nay!'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            const html = `
            <div class="hero-banner">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-8">
                            <span class="badge bg-primary mb-3">${course.categoryName || 'Khác'}</span>
                            <h1 class="display-6 fw-bold mb-3">${course.title}</h1>
                            <p class="lead opacity-75 fs-6">${course.headline || ''}</p>
                            <div class="d-flex align-items-center gap-4 mt-4 small opacity-75">
                                <span><i class="bi bi-person-fill me-1"></i> Giảng viên: ${course.instructorName}</span>
                                <span><i class="bi bi-bar-chart-fill me-1"></i> Cấp độ: ${course.level}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mb-5">
                <div class="row">
                    ${mainLayoutHtml}
                </div>
            </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            document.title = course.title + " - UTELearn";

        } catch (error) {
            document.getElementById('appContainer').innerHTML = `
                <div class="text-center py-5 my-5 text-danger">
                    <i class="bi bi-exclamation-triangle display-1"></i>
                    <h2 class="mt-3">Không tìm thấy khóa học</h2>
                    <a href="/courses" class="btn btn-primary mt-3">Quay lại danh sách</a>
                </div>
            `;
        }
    });

    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    function notifyOjPhase2(event) {
        if (event) {
            event.preventDefault();
        }
        showToast('Tính năng Luyện thi Online Judge đang được hoàn thiện trong Phase 2!', 'warning');
    }
</script>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
