<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học - UTELearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        html {
            overflow-y: scroll;
        }
        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }
        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand-title span {
            color: #2563eb;
        }
        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }
        
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 60px 0;
            position: relative;
        }
        .content-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }
        .enroll-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
            position: sticky;
            top: 90px;
        }
        .enroll-img { width: 100%; height: 220px; object-fit: cover; }
        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .instructor-edit-ctrl {
            display: none !important;
        }
        body.moodle-edit-mode-active .instructor-edit-ctrl {
            display: inline-flex !important;
        }
        body.moodle-edit-mode-active .instructor-edit-block {
            display: block !important;
        }
        @media (min-width: 992px) {
            .enroll-col-desktop {
                margin-top: -120px !important;
            }
        }
        @media (max-width: 991.98px) {
            .enroll-col-desktop {
                margin-top: 24px !important;
            }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: siteNavbar('courses')}"></nav>

<div id="appContainer">
    <div class="text-center py-5 my-5 text-muted">
        <div class="spinner-border text-primary fs-4 mb-3"></div>
        <h5>Đang tải dữ liệu khóa học...</h5>
    </div>
</div>

<script th:inline="javascript">
    const slug = /*[[${courseSlug}]]*/ 'default-slug';
    const isEnrolled = /*[[${isEnrolled != null ? isEnrolled : false}]]*/ false;
    const isAllEnrolled = /*[[${isAllEnrolled != null ? isAllEnrolled : false}]]*/ false;
    const fullCoursePrice = /*[[${fullCoursePrice != null ? fullCoursePrice : 0}]]*/ 0;
    const remainingCoursePrice = /*[[${remainingCoursePrice != null ? remainingCoursePrice : 0}]]*/ 0;
    const sumOfCohorts = /*[[${sumOfCohorts != null ? sumOfCohorts : 0}]]*/ 0;
    const discountAmount = /*[[${discountAmount != null ? discountAmount : 0}]]*/ 0;
    const unenrolledCount = /*[[${unenrolledCount != null ? unenrolledCount : 0}]]*/ 0;
    const hasAccessRole = /*[[${hasAccessRole != null ? hasAccessRole : false}]]*/ false;
    let currentCourseId = 0;

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/courses/' + slug);
            if (!res.ok) throw new Error("Khóa học không tồn tại");
            const course = await res.json();
            currentCourseId = course.id;
            
            const img = course.thumbnailUrl || '/images/courses/default-cover.png';
            
            let objItemsText = '';
            let rawObjArr = [];
            if (course.objectives && course.objectives !== '[]') {
                try {
                    rawObjArr = JSON.parse(course.objectives);
                } catch(e) {
                    rawObjArr = (course.objectives || '').split('\n').map(s => s.trim()).filter(s => s);
                }
            }
            if (Array.isArray(rawObjArr)) {
                objItemsText = rawObjArr.map(item => (typeof item === 'object' && item.value) ? item.value : item).join('\n');
            }

            let objectivesRenderHtml = '';
            if (rawObjArr && rawObjArr.length > 0) {
                rawObjArr.forEach(item => {
                    const text = (typeof item === 'object' && item.value) ? item.value : item;
                    objectivesRenderHtml += `<div class="col-md-6 d-flex gap-2"><i class="bi bi-check-circle-fill text-success mt-1"></i><span>${text}</span></div>`;
                });
            } else {
                objectivesRenderHtml = '<div class="col-12 text-muted small fst-italic">Chưa thiết lập mục tiêu đầu ra cho khóa học.</div>';
            }

            let introHtml = `
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-bullseye text-primary me-2"></i>Bạn sẽ học được gì?</h5>
                        <button class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1 instructor-edit-ctrl" onclick="toggleEditField('courseObjectives')">
                            <i class="bi bi-pencil-square me-1"></i>Sửa mục tiêu
                        </button>
                    </div>
                    
                    <div id="courseObjectivesViewWrap">
                        <div class="row g-2" id="courseObjectivesContainer">
                            ${objectivesRenderHtml}
                        </div>
                    </div>

                    <div id="courseObjectivesEditWrap" class="d-none bg-light p-3 rounded-4 border">
                        <label class="form-label fw-semibold small text-dark mb-1">Mỗi mục tiêu học tập viết trên một dòng:</label>
                        <textarea id="inputCourseObjectives" class="form-control rounded-3 mb-2" rows="5">${objItemsText}</textarea>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-success rounded-pill px-3 fw-semibold" onclick="saveCourseField('objectives')">
                                <i class="bi bi-check-lg me-1"></i>Lưu mục tiêu
                            </button>
                            <button class="btn btn-sm btn-light border rounded-pill px-3" onclick="toggleEditField('courseObjectives')">
                                Hủy
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-file-text text-primary me-2"></i>Mô tả khóa học</h5>
                        <button class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1 instructor-edit-ctrl" onclick="toggleEditField('courseDescription')">
                            <i class="bi bi-pencil-square me-1"></i>Sửa mô tả
                        </button>
                    </div>

                    <div id="courseDescriptionViewWrap">
                        <div class="text-muted" style="line-height: 1.7;" id="courseDescriptionText">
                            ${course.description || 'Chưa có mô tả chi tiết.'}
                        </div>
                    </div>

                    <div id="courseDescriptionEditWrap" class="d-none bg-light p-3 rounded-4 border">
                        <label class="form-label fw-semibold small text-dark mb-1">Nội dung mô tả khóa học chi tiết:</label>
                        <textarea id="inputCourseDescription" class="form-control rounded-3 mb-2" rows="6">${course.description || ''}</textarea>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-success rounded-pill px-3 fw-semibold" onclick="saveCourseField('description')">
                                <i class="bi bi-check-lg me-1"></i>Lưu mô tả
                            </button>
                            <button class="btn btn-sm btn-light border rounded-pill px-3" onclick="toggleEditField('courseDescription')">
                                Hủy
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const availableCohorts = /*[[${availableCohorts}]]*/ [];
            const cohortInfoMap = {};
            if (availableCohorts && availableCohorts.length > 0) {
                availableCohorts.forEach(c => {
                    cohortInfoMap[c.id] = c;
                });
            }

            let curriculumHtml = '';
            const allLessons = [];
            const lessonMap = {};
            if (course.curriculum && course.curriculum.length > 0) {
                course.curriculum.forEach(sec => {
                    if (sec.lessons) {
                        sec.lessons.forEach(l => {
                            l.sectionTitle = sec.section ? sec.section.title : '';
                            allLessons.push(l);
                            lessonMap[l.id] = l;
                        });
                    }
                });
            }

            if (course.modules && course.modules.length > 0) {
                const assignedLessonIds = new Set();
                let modulesAccordionHtml = '';

                course.modules.forEach((mod, mIdx) => {
                    const cohortInfo = cohortInfoMap[mod.id] || {};
                    const isModEnrolled = cohortInfo.isEnrolled || false;
                    const priceFormatted = mod.price > 0 
                        ? new Intl.NumberFormat('vi-VN').format(mod.price) + ' VNĐ' 
                        : 'Miễn phí';
                    const isFull = cohortInfo.currentEnrolled >= cohortInfo.maxCapacity;

                    const modLessons = [];
                    if (mod.lessonIds && Array.isArray(mod.lessonIds)) {
                        mod.lessonIds.forEach(lid => {
                            if (lessonMap[lid]) {
                                modLessons.push(lessonMap[lid]);
                                assignedLessonIds.add(lid);
                            }
                        });
                    }

                    let objectivesArr = [];
                    let objectivesRawText = '';
                    if (mod.objectives && mod.objectives.trim().length > 0 && mod.objectives !== '[]') {
                        try {
                            if (mod.objectives.trim().startsWith('[')) {
                                objectivesArr = JSON.parse(mod.objectives);
                            } else {
                                objectivesArr = mod.objectives.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                            }
                        } catch (e) {
                            objectivesArr = mod.objectives.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                        }
                    }
                    if (Array.isArray(objectivesArr) && objectivesArr.length > 0) {
                        objectivesRawText = objectivesArr.map(item => (typeof item === 'object' && item.value) ? item.value : item).join('\n');
                    }

                    let objectivesItemsHtml = '';
                    if (objectivesArr && objectivesArr.length > 0) {
                        objectivesItemsHtml = objectivesArr.map(item => {
                            const text = (typeof item === 'object' && item.value) ? item.value : item;
                            return `
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-check-circle-fill text-success mt-1 flex-shrink-0" style="font-size: 14px;"></i>
                                    <span class="text-secondary small lh-base">${text}</span>
                                </div>
                            `;
                        }).join('');
                    } else {
                        objectivesItemsHtml = `
                            <div class="d-flex align-items-start gap-2">
                                <i class="bi bi-check-circle-fill text-success mt-1 flex-shrink-0" style="font-size: 14px;"></i>
                                <span class="text-secondary small lh-base">Hoàn thành các kiến thức trọng tâm và kỹ năng thực hành cốt lõi của ${mod.name}.</span>
                            </div>
                            <div class="d-flex align-items-start gap-2">
                                <i class="bi bi-check-circle-fill text-success mt-1 flex-shrink-0" style="font-size: 14px;"></i>
                                <span class="text-secondary small lh-base">Vận dụng lý thuyết vào bài tập dự án thực chiến và kiểm tra đánh giá năng lực.</span>
                            </div>
                        `;
                    }

                    let objectivesBlockHtml = `
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-semibold text-dark small"><i class="bi bi-bullseye text-primary me-2"></i>Mục tiêu học phần:</span>
                                <button class="btn btn-xs btn-outline-primary rounded-pill px-2.5 py-0.5 instructor-edit-ctrl" onclick="toggleEditModuleObj('${mod.id}')" style="font-size: 11px;">
                                    <i class="bi bi-pencil me-1"></i>Sửa mục tiêu
                                </button>
                            </div>
                            <div id="modObjViewWrap_${mod.id}">
                                <div class="d-flex flex-column gap-2" id="modObjList_${mod.id}">
                                    ${objectivesItemsHtml}
                                </div>
                            </div>
                            <div id="modObjEditWrap_${mod.id}" class="d-none mt-2 bg-light p-3 rounded-3 border">
                                <label class="form-label fw-semibold small text-dark mb-1">Mỗi mục tiêu học phần viết trên một dòng:</label>
                                <textarea id="inputModObj_${mod.id}" class="form-control form-control-sm rounded-3 mb-2" rows="4">${objectivesRawText}</textarea>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-xs btn-success rounded-pill px-3 py-1 fw-semibold" onclick="saveModuleObj('${mod.id}')">
                                        <i class="bi bi-check-lg me-1"></i>Lưu mục tiêu module
                                    </button>
                                    <button class="btn btn-xs btn-light border rounded-pill px-3 py-1" onclick="toggleEditModuleObj('${mod.id}')">
                                        Hủy
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    let descHtml = `
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-semibold text-dark small"><i class="bi bi-info-circle text-primary me-2"></i>Mô tả học phần:</span>
                                <button class="btn btn-xs btn-outline-primary rounded-pill px-2.5 py-0.5 instructor-edit-ctrl" onclick="toggleEditModuleDesc('${mod.id}')" style="font-size: 11px;">
                                    <i class="bi bi-pencil me-1"></i>Sửa mô tả
                                </button>
                            </div>
                            <div id="modDescViewWrap_${mod.id}">
                                <p class="text-muted small mb-0 lh-base" id="modDescText_${mod.id}">${mod.description || 'Chưa có mô tả cho module này.'}</p>
                            </div>
                            <div id="modDescEditWrap_${mod.id}" class="d-none mt-2 bg-light p-3 rounded-3 border">
                                <label class="form-label fw-semibold small text-dark mb-1">Nội dung mô tả Module:</label>
                                <textarea id="inputModDesc_${mod.id}" class="form-control form-control-sm rounded-3 mb-2" rows="3">${mod.description || ''}</textarea>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-xs btn-success rounded-pill px-3 py-1 fw-semibold" onclick="saveModuleDesc('${mod.id}')">
                                        <i class="bi bi-check-lg me-1"></i>Lưu mô tả module
                                    </button>
                                    <button class="btn btn-xs btn-light border rounded-pill px-3 py-1" onclick="toggleEditModuleDesc('${mod.id}')">
                                        Hủy
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    let modActionHtml = '';
                    if (isModEnrolled || hasAccessRole) {
                        modActionHtml = `<a href="/courses/${slug}/modules/${mod.id}/learn" class="btn btn-success btn-sm rounded-pill px-3 fw-semibold"><i class="bi bi-play-circle-fill me-1"></i>${hasAccessRole ? 'Vào học / Giảng dạy' : 'Vào học ngay'}</a>`;
                    } else if (isFull) {
                        modActionHtml = `<span class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill">Đã đủ sĩ số</span>`;
                    } else {
                        modActionHtml = `
                            <form action="/courses/${slug}/enroll/${mod.id}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3 fw-semibold">
                                    <i class="bi bi-plus-circle me-1"></i>Ghi danh module (${priceFormatted})
                                </button>
                            </form>
                        `;
                    }

                    modulesAccordionHtml += `
                        <div class="accordion-item border-0 rounded-3 mb-3 shadow-sm overflow-hidden bg-white">
                            <h2 class="accordion-header" id="modHeading${mIdx}">
                                <button class="accordion-button bg-light py-3 px-4 ${mIdx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#modCollapse${mIdx}">
                                    <div class="d-flex flex-wrap justify-content-between align-items-center w-100 me-3 gap-2">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge bg-primary text-white" style="font-size: 11px;">Module ${mIdx + 1}</span>
                                            <span class="fw-bold text-dark fs-6" id="modHeadingTitle_${mod.id}">${mod.name}</span>
                                            <span class="badge bg-light text-primary border border-primary-subtle" style="font-size: 11px;">${mod.code}</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                            <span class="fw-semibold text-primary small">${priceFormatted}</span>
                                            <span class="badge bg-secondary-subtle text-secondary" style="font-size: 11px;">${modLessons.length} bài học</span>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div id="modCollapse${mIdx}" class="accordion-collapse collapse ${mIdx === 0 ? 'show' : ''}">
                                <div class="accordion-body p-4 bg-white border-top">
                                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 p-3 mb-3 bg-light rounded-3 border">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge bg-primary text-white">Module ${mIdx + 1}</span>
                                            <span class="fw-bold text-dark fs-6" id="modNameText_${mod.id}">${mod.name}</span>
                                            <span class="badge bg-white text-primary border border-primary-subtle">${mod.code}</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-2 instructor-edit-ctrl">
                                            <button class="btn btn-xs btn-outline-primary rounded-pill px-3 py-1 fw-semibold" onclick="toggleEditModule('${mod.id}')">
                                                <i class="bi bi-pencil me-1"></i>Sửa tên module
                                            </button>
                                        </div>
                                    </div>
                                    <div id="modNameEditWrap_${mod.id}" class="d-none mb-3 bg-light p-3 rounded-3 border">
                                        <label class="form-label fw-semibold small text-dark mb-1">Chỉnh sửa tên Module / Học phần:</label>
                                        <div class="input-group">
                                            <input type="text" id="inputModName_${mod.id}" class="form-control rounded-start-3 fw-bold" value="${mod.name}">
                                            <button class="btn btn-success px-3 fw-semibold" onclick="saveModuleField('${mod.id}', 'name')">
                                                <i class="bi bi-check-lg me-1"></i>Lưu
                                            </button>
                                            <button class="btn btn-light border px-3" onclick="toggleEditModule('${mod.id}')">
                                                Hủy
                                            </button>
                                        </div>
                                    </div>
                                    ${descHtml}
                                    ${objectivesBlockHtml}
                                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pt-3 border-top mt-3">
                                        <div class="d-flex align-items-center gap-2 text-muted small">
                                            <i class="bi bi-journal-text text-primary"></i>
                                            <span>Chuyên đề gồm <strong>${modLessons.length}</strong> bài học</span>
                                        </div>
                                        <div class="d-flex flex-wrap align-items-center gap-2">
                                            <a href="/courses/${slug}/modules/${mod.id}" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                                                <i class="bi bi-box-arrow-up-right me-1"></i>Xem chi tiết Module
                                            </a>
                                            ${hasAccessRole ? `
                                            <a href="/courses/${slug}/modules/${mod.id}" class="btn btn-warning btn-sm rounded-pill px-3 fw-semibold instructor-edit-ctrl">
                                                <i class="bi bi-pencil-square me-1"></i>Chỉnh sửa cấu trúc Module
                                            </a>
                                            <a href="/instructor/cohorts/${mod.id}/edit" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold instructor-edit-ctrl">
                                                <i class="bi bi-gear-fill me-1"></i>Cài đặt Module
                                            </a>
                                            ` : ''}
                                            ${modActionHtml}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const standaloneSections = (course.curriculum || []).filter(sec => sec.section && !sec.section.cohortId && sec.lessons && sec.lessons.length > 0);
                if (standaloneSections.length > 0) {
                    standaloneSections.forEach((sec, sIdx) => {
                        let secLessonsHtml = '';
                        sec.lessons.forEach(lesson => {
                            assignedLessonIds.add(lesson.id);
                            let icon = 'bi-file-earmark-text';
                            if (lesson.lessonType === 'VIDEO') icon = 'bi-play-circle-fill text-primary';
                            else if (lesson.lessonType === 'DOCUMENT') icon = 'bi-file-earmark-text-fill text-success';
                            else if (lesson.lessonType === 'QUIZ') icon = 'bi-question-circle-fill text-warning';
                            else if (lesson.lessonType === 'CODE_PRACTICE') icon = 'bi-code-slash text-info';

                            secLessonsHtml += `

                const savedEdit = localStorage.getItem('utelearn_course_edit_mode_' + slug);
                if (savedEdit === 'true' && editToggle) {
                    editToggle.checked = true;
                    if (editToolbar) editToolbar.classList.remove('d-none');
                    editToolbar.classList.add('d-flex');
                    document.body.classList.add('moodle-edit-mode-active');
                }
                if (editToggle) {
                    editToggle.addEventListener('change', function() {
                        if (this.checked) {
                            if (editToolbar) {
                                editToolbar.classList.remove('d-none');
                                editToolbar.classList.add('d-flex');
                            }
                            document.body.classList.add('moodle-edit-mode-active');
                            localStorage.setItem('utelearn_course_edit_mode_' + slug, 'true');
                            showToast('Chế độ chỉnh sửa khóa học đã BẬT', 'success');
                        } else {
                            if (editToolbar) {
                                editToolbar.classList.add('d-none');
                                editToolbar.classList.remove('d-flex');
                            }
                            document.body.classList.remove('moodle-edit-mode-active');
                            localStorage.setItem('utelearn_course_edit_mode_' + slug, 'false');
                            showToast('Chế độ xem học viên đã BẬT', 'warning');
                        }
                    });
                }
            }

        } catch (error) {
            document.getElementById('appContainer').innerHTML = `
                <div class="text-center py-5 my-5 text-danger">
                    <i class="bi bi-exclamation-triangle display-1"></i>
                    <h2 class="mt-3">Không tìm thấy khóa học</h2>
                    <a href="/courses" class="btn btn-primary mt-3">Quay lại danh sách</a>
                </div>
            `;
        }
    });

    function toggleEditField(fieldKey) {
        const viewEl = document.getElementById(fieldKey + 'ViewWrap');
        const editEl = document.getElementById(fieldKey + 'EditWrap');
        if (!viewEl || !editEl) return;
        if (editEl.classList.contains('d-none')) {
            editEl.classList.remove('d-none');
            viewEl.classList.add('d-none');
            const input = editEl.querySelector('input, textarea, select');
            if (input) input.focus();
        } else {
            editEl.classList.add('d-none');
            viewEl.classList.remove('d-none');
        }
    }

    async function saveCourseField(fieldKey) {
        let value = null;
        let payloadKey = fieldKey;
        let displayEl = null;

        if (fieldKey === 'title') {
            value = document.getElementById('inputCourseTitle').value.trim();
            if (!value) {
                showToast('Tiêu đề không được để trống!', 'error');
                return;
            }
            displayEl = document.getElementById('courseTitleText');
        } else if (fieldKey === 'headline') {
            value = document.getElementById('inputCourseHeadline').value.trim();
            displayEl = document.getElementById('courseHeadlineText');
        } else if (fieldKey === 'level') {
            value = document.getElementById('inputCourseLevel').value;
            displayEl = document.getElementById('courseLevelText');
        } else if (fieldKey === 'objectives') {
            const raw = document.getElementById('inputCourseObjectives').value;
            value = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        } else if (fieldKey === 'description') {
            value = document.getElementById('inputCourseDescription').value.trim();
            displayEl = document.getElementById('courseDescriptionText');
        }

        try {
            const res = await fetch(`/api/instructor/courses/${currentCourseId}/inline`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ [payloadKey]: value })
            });

            if (res.ok) {
                const updated = await res.json();
                if (fieldKey === 'title') {
                    if (displayEl) displayEl.textContent = updated.title;
                    document.title = updated.title + " - UTELearn";
                    toggleEditField('courseTitle');
                } else if (fieldKey === 'headline') {
                    if (displayEl) displayEl.textContent = updated.headline || 'Chưa có mô tả ngắn';
                    toggleEditField('courseHeadline');
                } else if (fieldKey === 'level') {
                    let levelLabel = 'Tất cả cấp độ';
                    if (updated.level === 'BEGINNER') levelLabel = 'Người mới bắt đầu';
                    else if (updated.level === 'INTERMEDIATE') levelLabel = 'Trung bình';
                    else if (updated.level === 'ADVANCED') levelLabel = 'Nâng cao';
                    if (displayEl) displayEl.textContent = levelLabel;
                    toggleEditField('courseLevel');
                } else if (fieldKey === 'objectives') {
                    let objArr = [];
                    try {
                        objArr = JSON.parse(updated.objectives);
                    } catch(e) {
                        objArr = value;
                    }
                    const container = document.getElementById('courseObjectivesContainer');
                    if (container) {
                        if (objArr && objArr.length > 0) {
                            container.innerHTML = objArr.map(item => `<div class="col-md-6 d-flex gap-2"><i class="bi bi-check-circle-fill text-success mt-1"></i><span>${item.value || item}</span></div>`).join('');
                        } else {
                            container.innerHTML = '<div class="col-12 text-muted small fst-italic">Chưa thiết lập mục tiêu đầu ra cho khóa học.</div>';
                        }
                    }
                    toggleEditField('courseObjectives');
                } else if (fieldKey === 'description') {
                    if (displayEl) displayEl.innerHTML = updated.description || 'Chưa có mô tả chi tiết.';
                    toggleEditField('courseDescription');
                }
                showToast('Đã lưu thay đổi thành công!', 'success');
            } else {
                const err = await res.text();
                showToast('Lỗi lưu: ' + err, 'error');
            }
        } catch (e) {
            showToast('Lỗi kết nối máy chủ', 'error');
        }
    }

    function toggleEditModule(modId) {
        const editEl = document.getElementById('modNameEditWrap_' + modId);
        if (!editEl) return;
        if (editEl.classList.contains('d-none')) {
            editEl.classList.remove('d-none');
            const input = document.getElementById('inputModName_' + modId);
            if (input) input.focus();
        } else {
            editEl.classList.add('d-none');
        }
    }

    async function saveModuleField(modId, fieldKey) {
        const input = document.getElementById('inputModName_' + modId);
        const val = input ? input.value.trim() : '';
        if (!val) {
            showToast('Tên module không được để trống!', 'error');
            return;
        }

        try {
            const res = await fetch(`/api/instructor/courses/modules/${modId}/inline`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ [fieldKey]: val })
            });

            if (res.ok) {
                const updated = await res.json();
                const textEl = document.getElementById('modNameText_' + modId);
                if (textEl) textEl.textContent = updated.name;
                const headingEl = document.getElementById('modHeadingTitle_' + modId);
                if (headingEl) headingEl.textContent = updated.name;
                toggleEditModule(modId);
                showToast('Đã cập nhật tên Module!', 'success');
            } else {
                const err = await res.text();
                showToast('Lỗi: ' + err, 'error');
            }
        } catch (e) {
            showToast('Lỗi kết nối máy chủ', 'error');
        }
    }

    function toggleEditModuleDesc(modId) {
        const editEl = document.getElementById('modDescEditWrap_' + modId);
        if (!editEl) return;
        if (editEl.classList.contains('d-none')) {
            editEl.classList.remove('d-none');
            const input = document.getElementById('inputModDesc_' + modId);
            if (input) input.focus();
        } else {
            editEl.classList.add('d-none');
        }
    }

    async function saveModuleDesc(modId) {
        const input = document.getElementById('inputModDesc_' + modId);
        const val = input ? input.value.trim() : '';

        try {
            const res = await fetch(`/api/instructor/courses/modules/${modId}/inline`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ description: val })
            });

            if (res.ok) {
                const updated = await res.json();
                const textEl = document.getElementById('modDescText_' + modId);
                if (textEl) textEl.textContent = updated.description || 'Chưa có mô tả cho module này.';
                toggleEditModuleDesc(modId);
                showToast('Đã cập nhật mô tả Module!', 'success');
            } else {
                const err = await res.text();
                showToast('Lỗi: ' + err, 'error');
            }
        } catch (e) {
            showToast('Lỗi kết nối máy chủ', 'error');
        }
    }

    function toggleEditModuleObj(modId) {
        const editEl = document.getElementById('modObjEditWrap_' + modId);
        if (!editEl) return;
        if (editEl.classList.contains('d-none')) {
            editEl.classList.remove('d-none');
            const input = document.getElementById('inputModObj_' + modId);
            if (input) input.focus();
        } else {
            editEl.classList.add('d-none');
        }
    }

    async function saveModuleObj(modId) {
        const input = document.getElementById('inputModObj_' + modId);
        const val = input ? input.value : '';
        const objArr = val.split('\n').map(s => s.trim()).filter(s => s.length > 0);

        try {
            const res = await fetch(`/api/instructor/courses/modules/${modId}/inline`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ objectives: JSON.stringify(objArr) })
            });

            if (res.ok) {
                const listEl = document.getElementById('modObjList_' + modId);
                if (listEl) {
                    if (objArr.length > 0) {
                        listEl.innerHTML = objArr.map(item => `
                            <div class="d-flex align-items-start gap-2">
                                <i class="bi bi-check-circle-fill text-success mt-1 flex-shrink-0" style="font-size: 14px;"></i>
                                <span class="text-secondary small lh-base">${item}</span>
                            </div>
                        `).join('');
                    } else {
                        listEl.innerHTML = '<div class="text-muted small fst-italic">Chưa có mục tiêu cụ thể.</div>';
                    }
                }
                toggleEditModuleObj(modId);
                showToast('Đã cập nhật mục tiêu Module!', 'success');
            } else {
                const err = await res.text();
                showToast('Lỗi: ' + err, 'error');
            }
        } catch (e) {
            showToast('Lỗi kết nối máy chủ', 'error');
        }
    }

    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    function notifyOjPhase2(event) {
        if (event) {
            event.preventDefault();
        }
        showToast('Tính năng Luyện thi Online Judge đang được hoàn thiện trong Phase 2!', 'warning');
    }
</script>
