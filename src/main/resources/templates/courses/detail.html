<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học - UTELearn</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        html {
            overflow-y: scroll;
        }
        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* Navbar */
        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }
        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand-title span {
            color: #2563eb;
        }
        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }
        
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 60px 0;
            position: relative;
        }
        .content-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }
        .enroll-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
            position: sticky;
            top: 90px;
        }
        .enroll-img { width: 100%; height: 220px; object-fit: cover; }
        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: siteNavbar('courses')}"></nav>

<div id="appContainer">
    <div class="text-center py-5 my-5 text-muted">
        <div class="spinner-border text-primary fs-4 mb-3"></div>
        <h5>Đang tải dữ liệu khóa học...</h5>
    </div>
</div>

<script th:inline="javascript">
    const slug = /*[[${courseSlug}]]*/ 'default-slug';
    const isEnrolled = /*[[${isEnrolled != null ? isEnrolled : false}]]*/ false;
    const isAllEnrolled = /*[[${isAllEnrolled != null ? isAllEnrolled : false}]]*/ false;
    const fullCoursePrice = /*[[${fullCoursePrice != null ? fullCoursePrice : 0}]]*/ 0;
    const remainingCoursePrice = /*[[${remainingCoursePrice != null ? remainingCoursePrice : 0}]]*/ 0;
    const sumOfCohorts = /*[[${sumOfCohorts != null ? sumOfCohorts : 0}]]*/ 0;
    const discountAmount = /*[[${discountAmount != null ? discountAmount : 0}]]*/ 0;
    const unenrolledCount = /*[[${unenrolledCount != null ? unenrolledCount : 0}]]*/ 0;
    const hasAccessRole = /*[[${hasAccessRole != null ? hasAccessRole : false}]]*/ false;

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/courses/' + slug);
            if (!res.ok) throw new Error("Khóa học không tồn tại");
            const course = await res.json();
            
            const img = course.thumbnailUrl || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80';
            let objectivesHtml = '';
            if (course.objectives && course.objectives !== '[]') {
                try {
                    const objArr = JSON.parse(course.objectives);
                    if (objArr.length > 0) {
                        objectivesHtml = '<h5 class="fw-bold mb-3">Bạn sẽ học được gì?</h5><div class="row g-2 mb-4">';
                        objArr.forEach(item => {
                            objectivesHtml += `<div class="col-md-6 d-flex gap-2"><i class="bi bi-check-circle-fill text-success mt-1"></i><span>${item.value || item}</span></div>`;
                        });
                        objectivesHtml += '</div>';
                    }
                } catch(e) {}
            }

            let introHtml = `
                ${objectivesHtml}
                <h5 class="fw-bold mb-3">Mô tả khóa học</h5>
                <div class="text-muted" style="line-height: 1.7;">
                    ${course.description || 'Chưa có mô tả chi tiết.'}
                </div>
            `;

            const availableCohorts = /*[[${availableCohorts}]]*/ [];
            const cohortInfoMap = {};
            if (availableCohorts && availableCohorts.length > 0) {
                availableCohorts.forEach(c => {
                    cohortInfoMap[c.id] = c;
                });
            }

            let curriculumHtml = '';
            const allLessons = [];
            const lessonMap = {};
            if (course.curriculum && course.curriculum.length > 0) {
                course.curriculum.forEach(sec => {
                    if (sec.lessons) {
                        sec.lessons.forEach(l => {
                            l.sectionTitle = sec.section ? sec.section.title : '';
                            allLessons.push(l);
                            lessonMap[l.id] = l;
                        });
                    }
                });
            }

            if (course.modules && course.modules.length > 0) {
                const assignedLessonIds = new Set();
                let modulesAccordionHtml = '';

                course.modules.forEach((mod, mIdx) => {
                    const cohortInfo = cohortInfoMap[mod.id] || {};
                    const isModEnrolled = cohortInfo.isEnrolled || false;
                    const priceFormatted = mod.price > 0 
                        ? new Intl.NumberFormat('vi-VN').format(mod.price) + ' VNĐ' 
                        : 'Miễn phí';
                    const isFull = cohortInfo.currentEnrolled >= cohortInfo.maxCapacity;

                    const modLessons = [];
                    if (mod.lessonIds && Array.isArray(mod.lessonIds)) {
                        mod.lessonIds.forEach(lid => {
                            if (lessonMap[lid]) {
                                modLessons.push(lessonMap[lid]);
                                assignedLessonIds.add(lid);
                            }
                        });
                    }

                    let lessonsListHtml = '';
                    if (modLessons.length > 0) {
                        modLessons.forEach((lesson, lIdx) => {
                            let icon = 'bi-file-earmark-text';
                            if (lesson.lessonType === 'VIDEO') icon = 'bi-play-circle-fill text-primary';
                            else if (lesson.lessonType === 'DOCUMENT') icon = 'bi-file-earmark-text-fill text-success';
                            else if (lesson.lessonType === 'QUIZ') icon = 'bi-question-circle-fill text-warning';
                            else if (lesson.lessonType === 'CODE_PRACTICE') icon = 'bi-code-slash text-info';
                            else if (lesson.lessonType === 'ANNOUNCEMENT') icon = 'bi-megaphone-fill text-danger';

                            const canAccessLesson = isModEnrolled || lesson.isFreePreview;

                            let badge = '';
                            if (lesson.isFreePreview) {
                                badge = '<span class="badge bg-success-subtle text-success ms-auto" style="font-size: 11px;"><i class="bi bi-play-circle me-1"></i>Học thử</span>';
                            } else if (isModEnrolled) {
                                badge = '<span class="badge bg-success-subtle text-success ms-auto" style="font-size: 11px;"><i class="bi bi-check-circle-fill me-1"></i>Đã mở</span>';
                            } else {
                                badge = '<span class="badge bg-secondary-subtle text-secondary ms-auto" style="font-size: 11px;"><i class="bi bi-lock-fill me-1"></i>Đã khóa</span>';
                            }

                            let contentHtml = '';
                            let actionsHtml = '';
                            if (canAccessLesson) {
                                if (lesson.documentContent) {
                                    contentHtml += `<div class="mt-2 text-dark small bg-white border p-3 rounded shadow-sm" style="white-space: pre-wrap;">${lesson.documentContent}</div>`;
                                }
                                if (lesson.videoUrl) {
                                    actionsHtml += `<a href="${lesson.videoUrl}" target="_blank" class="btn btn-sm btn-primary me-2"><i class="bi bi-play-circle me-1"></i>Xem Video</a>`;
                                }
                                if (lesson.assetUrl) {
                                    actionsHtml += `<a href="${lesson.assetUrl}" target="_blank" class="btn btn-sm btn-outline-success"><i class="bi bi-download me-1"></i>Tài liệu đính kèm</a>`;
                                }
                            } else {
                                actionsHtml += `<span class="small text-muted fst-italic"><i class="bi bi-lock-fill me-1"></i>Vui lòng ghi danh module này để truy cập toàn bộ bài giảng và tài liệu.</span>`;
                            }

                            if (actionsHtml) {
                                contentHtml += `<div class="mt-2">${actionsHtml}</div>`;
                            }

                            lessonsListHtml += `
                                <li class="list-group-item p-3 border-0 border-bottom bg-transparent">
                                    <div class="d-flex align-items-center">
                                        <i class="bi ${icon} fs-5 me-2"></i>
                                        <span class="fw-medium">${lesson.title}</span>
                                        ${badge}
                                    </div>
                                    ${contentHtml ? `<div class="ms-4 mt-2">${contentHtml}</div>` : ''}
                                </li>
                            `;
                        });
                    } else {
                        lessonsListHtml = '<li class="list-group-item text-muted small p-3 text-center border-0">Chưa có bài học nào trong module này.</li>';
                    }

                    let modActionHtml = '';
                    if (isModEnrolled) {
                        modActionHtml = `<span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill fw-semibold"><i class="bi bi-check-circle-fill me-1"></i>Đã sở hữu</span>`;
                    } else if (isFull) {
                        modActionHtml = `<span class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill">Đã đủ sĩ số</span>`;
                    } else {
                        modActionHtml = `
                            <form action="/courses/${slug}/enroll/${mod.id}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
                                    <i class="bi bi-plus-circle me-1"></i>Ghi danh module (${priceFormatted})
                                </button>
                            </form>
                        `;
                    }

                    modulesAccordionHtml += `
                        <div class="accordion-item border-0 rounded-3 mb-3 shadow-sm overflow-hidden bg-white">
                            <h2 class="accordion-header" id="modHeading${mIdx}">
                                <button class="accordion-button bg-light py-3 px-4 ${mIdx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#modCollapse${mIdx}">
                                    <div class="d-flex flex-wrap justify-content-between align-items-center w-100 me-3 gap-2">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge bg-primary text-white" style="font-size: 11px;">Module ${mIdx + 1}</span>
                                            <span class="fw-bold text-dark fs-6">${mod.name}</span>
                                            <span class="badge bg-light text-primary border border-primary-subtle" style="font-size: 11px;">${mod.code}</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                            <span class="fw-semibold text-primary small">${priceFormatted}</span>
                                            <span class="badge bg-secondary-subtle text-secondary" style="font-size: 11px;">${modLessons.length} bài học</span>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div id="modCollapse${mIdx}" class="accordion-collapse collapse ${mIdx === 0 ? 'show' : ''}">
                                <div class="accordion-body p-0">
                                    <div class="p-3 bg-light bg-opacity-50 border-bottom d-flex justify-content-between align-items-center">
                                        <small class="text-muted"><i class="bi bi-check2-circle me-1 text-success"></i>Chặng học phần ${mIdx + 1} của khóa học</small>
                                        <div>${modActionHtml}</div>
                                    </div>
                                    <ul class="list-group list-group-flush">
                                        ${lessonsListHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const unassignedLessons = allLessons.filter(l => !assignedLessonIds.has(l.id));
                if (unassignedLessons.length > 0) {
                    let unassignedHtml = '';
                    unassignedLessons.forEach(lesson => {
                        let icon = 'bi-file-earmark-text';
                        if (lesson.lessonType === 'VIDEO') icon = 'bi-play-circle-fill text-primary';
                        else if (lesson.lessonType === 'DOCUMENT') icon = 'bi-file-earmark-text-fill text-success';
                        else if (lesson.lessonType === 'QUIZ') icon = 'bi-question-circle-fill text-warning';

                        unassignedHtml += `
                            <li class="list-group-item p-3 border-0 border-bottom bg-transparent">
                                <div class="d-flex align-items-center">
                                    <i class="bi ${icon} fs-5 me-2"></i>
                                    <span class="fw-medium">${lesson.title}</span>
                                    <span class="badge bg-light text-muted border ms-auto" style="font-size: 10px;">Bổ trợ</span>
                                </div>
                            </li>
                        `;
                    });

                    modulesAccordionHtml += `
                        <div class="accordion-item border-0 rounded-3 mb-3 shadow-sm overflow-hidden bg-white">
                            <h2 class="accordion-header" id="modHeadingUnassigned">
                                <button class="accordion-button bg-light collapsed py-3 px-4" type="button" data-bs-toggle="collapse" data-bs-target="#modCollapseUnassigned">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="badge bg-secondary text-white" style="font-size: 11px;">Bổ trợ</span>
                                        <span class="fw-bold text-dark fs-6">Chuyên đề bổ sung & Tài liệu tham khảo</span>
                                    </div>
                                </button>
                            </h2>
                            <div id="modCollapseUnassigned" class="accordion-collapse collapse">
                                <div class="accordion-body p-0">
                                    <ul class="list-group list-group-flush">
                                        ${unassignedHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }

                curriculumHtml = `
                    <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-collection me-2 text-primary"></i>Lộ trình học tập theo các Module & Chuyên đề</h5>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill">${course.modules.length} module học phần</span>
                    </div>
                    <div class="accordion mb-4" id="curriculumAccordion">
                        ${modulesAccordionHtml}
                    </div>
                `;
            } else if (course.curriculum && course.curriculum.length > 0) {
                curriculumHtml = `
                    <h5 class="fw-bold mt-5 mb-3">Nội dung khóa học</h5>
                    <div class="accordion mb-4" id="curriculumAccordion">
                `;
                course.curriculum.forEach((item, index) => {
                    let lessonsHtml = '';
                    if (item.lessons && item.lessons.length > 0) {
                        item.lessons.forEach(lesson => {
                            let icon = 'bi-file-earmark-text';
                            if (lesson.lessonType === 'VIDEO') icon = 'bi-play-circle-fill text-primary';
                            else if (lesson.lessonType === 'DOCUMENT') icon = 'bi-file-earmark-text-fill text-success';
                            else if (lesson.lessonType === 'QUIZ') icon = 'bi-question-circle-fill text-warning';
                            else if (lesson.lessonType === 'CODE_PRACTICE') icon = 'bi-code-slash text-info';
                            else if (lesson.lessonType === 'ANNOUNCEMENT') icon = 'bi-megaphone-fill text-danger';

                            let badge = '';
                            if (lesson.isFreePreview) {
                                badge = '<span class="badge bg-success-subtle text-success ms-auto" style="font-size: 11px;"><i class="bi bi-play-circle me-1"></i>Học thử</span>';
                            } else if (isAllEnrolled) {
                                badge = '<span class="badge bg-success-subtle text-success ms-auto" style="font-size: 11px;"><i class="bi bi-check-circle-fill me-1"></i>Đã mở</span>';
                            } else {
                                badge = `<span class="badge bg-secondary-subtle text-secondary ms-auto" style="font-size: 11px;"><i class="bi bi-lock-fill me-1"></i>Đã khóa</span>`;
                            }

                            lessonsHtml += `
                                <li class="list-group-item p-3 border-0 border-bottom bg-transparent">
                                    <div class="d-flex align-items-center">
                                        <i class="bi ${icon} fs-5 me-2"></i>
                                        <span class="fw-medium">${lesson.title}</span>
                                        ${badge}
                                    </div>
                                </li>
                            `;
                        });
                    } else {
                        lessonsHtml = '<li class="list-group-item text-muted small p-3 text-center border-0 border-bottom">Chương này chưa có bài học nào.</li>';
                    }

                    curriculumHtml += `
                        <div class="accordion-item border-0 rounded-3 mb-2 shadow-sm overflow-hidden">
                            <h2 class="accordion-header" id="heading${index}">
                                <button class="accordion-button bg-light fw-bold ${index !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                                    ${item.section.title}
                                </button>
                            </h2>
                            <div id="collapse${index}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}">
                                <div class="accordion-body p-0">
                                    <ul class="list-group list-group-flush">
                                        ${lessonsHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                });
                curriculumHtml += `</div>`;
            }

            let enrollFormHtml = '';
            if (availableCohorts && availableCohorts.length > 0) {
                let fullCourseSection = '';
                if (!isAllEnrolled) {
                    const priceFormatted = remainingCoursePrice > 0 ? new Intl.NumberFormat('vi-VN').format(remainingCoursePrice) + ' VNĐ' : 'Miễn phí';
                    let discountHtml = '';
                    if (!isEnrolled && discountAmount > 0) {
                        const originalFormatted = new Intl.NumberFormat('vi-VN').format(sumOfCohorts) + ' VNĐ';
                        const discountFormatted = new Intl.NumberFormat('vi-VN').format(discountAmount) + ' VNĐ';
                        discountHtml = `
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="text-muted text-decoration-line-through small" style="font-size: 13px;">${originalFormatted}</span>
                                <span class="badge bg-danger-subtle text-danger border border-danger-subtle fw-semibold" style="font-size: 11px;">Tiết kiệm ${discountFormatted}</span>
                            </div>
                        `;
                    }
                    const fullBtnText = isEnrolled 
                        ? `Đăng ký ${unenrolledCount} module còn lại (${priceFormatted})` 
                        : `Đăng ký trọn gói (${priceFormatted})`;
                    
                    fullCourseSection = `
                        <div class="card border-primary border-opacity-25 bg-primary bg-opacity-10 rounded-3 p-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-bold text-primary small"><i class="bi bi-stars me-1"></i>Gói trọn bộ khóa học</span>
                                <span class="badge bg-primary text-white" style="font-size: 10px;">Ưu đãi Combo</span>
                            </div>
                            <div class="text-muted small mb-2" style="font-size: 12px;">Truy cập tất cả các module và chặng học của khóa</div>
                            ${discountHtml}
                            <form action="/courses/${slug}/enroll-all" method="post">
                                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold btn-sm py-2 shadow-sm">
                                    <i class="bi bi-bag-check-fill me-1"></i>${fullBtnText}
                                </button>
                            </form>
                        </div>
                    `;
                }

                let quickLearnBtn = '';
                if (isEnrolled || hasAccessRole) {
                    quickLearnBtn = `<a href="/courses/${slug}/learn" class="btn btn-gradient w-100 rounded-pill mb-3"><i class="bi bi-play-circle-fill me-1"></i>${hasAccessRole ? 'Vào học / Giảng dạy' : 'Vào học các module đã mở'}</a>`;
                }

                enrollFormHtml = `
                    ${quickLearnBtn}
                    ${fullCourseSection}
                    <div class="card border rounded-3 p-3 bg-light mb-3">
                        <div class="fw-bold small text-muted text-uppercase mb-2">Thông tin khóa học</div>
                        <ul class="list-unstyled mb-0 small d-flex flex-column gap-2">
                            <li class="d-flex justify-content-between">
                                <span class="text-muted"><i class="bi bi-collection me-1"></i>Lộ trình học phần:</span>
                                <span class="fw-semibold text-dark">${availableCohorts.length} module</span>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span class="text-muted"><i class="bi bi-play-circle me-1"></i>Tổng số bài học:</span>
                                <span class="fw-semibold text-dark">${allLessons.length} bài học</span>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span class="text-muted"><i class="bi bi-patch-check me-1"></i>Cấp chứng chỉ:</span>
                                <span class="fw-semibold text-success">Có</span>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span class="text-muted"><i class="bi bi-clock-history me-1"></i>Thời gian truy cập:</span>
                                <span class="fw-semibold text-dark">Trọn đời</span>
                            </li>
                        </ul>
                    </div>
                `;
            } else {
                let quickLearnBtn = '';
                if (isEnrolled || hasAccessRole) {
                    quickLearnBtn = `
                        <a href="/courses/${slug}/learn" class="btn btn-gradient w-100 rounded-pill mb-3">
                            <i class="bi bi-play-circle-fill me-1"></i>${hasAccessRole ? 'Vào học / Giảng dạy' : 'Vào học ngay'}
                        </a>
                    `;
                }
                let coursePurchaseSection = '';
                if (!isEnrolled) {
                    const priceFormatted = (fullCoursePrice > 0) 
                        ? new Intl.NumberFormat('vi-VN').format(fullCoursePrice) + ' VNĐ' 
                        : 'Miễn phí';
                    coursePurchaseSection = `
                        <div class="card border-primary border-opacity-25 bg-primary bg-opacity-10 rounded-3 p-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-bold text-primary small"><i class="bi bi-stars me-1"></i>Khóa học trọn gói</span>
                                <span class="badge bg-primary text-white" style="font-size: 10px;">Toàn bộ lộ trình</span>
                            </div>
                            <div class="text-muted small mb-2" style="font-size: 12px;">Đăng ký ngay để truy cập toàn bộ bài giảng và tài liệu học tập</div>
                            <div class="h5 fw-bold text-success mb-3">${priceFormatted}</div>
                            <form action="/courses/${slug}/enroll-all" method="post">
                                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold btn-sm py-2 shadow-sm">
                                    <i class="bi bi-bag-check-fill me-1"></i>Đăng ký học ngay (${priceFormatted})
                                </button>
                            </form>
                        </div>
                    `;
                }
                enrollFormHtml = quickLearnBtn + coursePurchaseSection;
            }

            let roleBadgeHtml = '';
            if (hasAccessRole) {
                roleBadgeHtml = `
                    <div class="alert alert-primary py-2 px-3 mb-3 small d-flex align-items-center rounded-3">
                        <i class="bi bi-shield-check fs-5 me-2 text-primary"></i>
                        <div>
                            <strong>Quyền Giảng viên / Quản trị</strong>
                            <div class="text-muted" style="font-size: 11px;">Bạn có quyền truy cập trực tiếp bài học hoặc thử nghiệm luồng mua.</div>
                        </div>
                    </div>
                `;
            }

            const mainLayoutHtml = `
                <div class="col-lg-8">
                    <div class="content-card">
                        ${introHtml}
                        ${curriculumHtml}
                    </div>
                </div>
                <div class="col-lg-4 mt-4 mt-lg-0" style="margin-top: -120px !important;">
                    <div class="enroll-card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
                        <img src="${img}" class="enroll-img w-100" style="height: 220px; object-fit: cover;" alt="Course Image">
                        <div class="p-4">
                            ${roleBadgeHtml}
                            ${enrollFormHtml}
                            <div class="text-center small text-muted mt-3">${(isEnrolled || hasAccessRole) ? 'Tiếp tục hành trình học tập' : 'Bắt đầu học ngay hôm nay!'}</div>
                        </div>
                    </div>
                </div>
            `;

            const html = `
            <div class="hero-banner">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-8">
                            <span class="badge bg-primary mb-3">${course.categoryName || 'Khác'}</span>
                            <h1 class="display-6 fw-bold mb-3">${course.title}</h1>
                            <p class="lead opacity-75 fs-6">${course.headline || ''}</p>
                            <div class="d-flex align-items-center gap-4 mt-4 small opacity-75">
                                <span><i class="bi bi-person-fill me-1"></i> Giảng viên: ${course.instructorName}</span>
                                <span><i class="bi bi-bar-chart-fill me-1"></i> Cấp độ: ${course.level}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mb-5">
                <div class="row">
                    ${mainLayoutHtml}
                </div>
            </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            document.title = course.title + " - UTELearn";

        } catch (error) {
            document.getElementById('appContainer').innerHTML = `
                <div class="text-center py-5 my-5 text-danger">
                    <i class="bi bi-exclamation-triangle display-1"></i>
                    <h2 class="mt-3">Không tìm thấy khóa học</h2>
                    <a href="/courses" class="btn btn-primary mt-3">Quay lại danh sách</a>
                </div>
            `;
        }
    });

    function showToast(message, type) {
        let iconHtml = '';
        if (type === 'success') {
            iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else if (type === 'warning') {
            iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
        } else {
            iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
        }

        let toast = Toastify({
            text: `<div style="display: flex; align-items: center; gap: 10px;">
                    ${iconHtml}
                    <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
                   </div>`,
            escapeMarkup: false,
            duration: 3000,
            close: false,
            gravity: "top",
            position: "right",
            style: {
                background: "white",
                borderRadius: "30px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
                padding: "10px 20px 10px 12px",
                border: "1px solid #f0f0f0",
                cursor: "pointer"
            },
            onClick: function() {
                toast.hideToast();
            }
        });
        toast.showToast();
    }

    function notifyOjPhase2(event) {
        if (event) {
            event.preventDefault();
        }
        showToast('Tính năng Luyện thi Online Judge đang được hoàn thiện trong Phase 2!', 'warning');
    }
</script>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
