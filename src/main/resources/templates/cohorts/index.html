<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" href="/images/brand/UTELearn_SquareLogo_2.png">
    <link rel="apple-touch-icon" href="/images/brand/UTELearn_SquareLogo_2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module & Chuyên đề - UTELearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

    <style>
        html {
            overflow-y: scroll;
        }

        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .brand-title span {
            color: #2563eb;
        }

        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .course-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }

        .course-image-wrapper {
            height: 190px;
            position: relative;
            overflow: hidden;
        }

        .course-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .course-card:hover .course-image-wrapper img {
            transform: scale(1.05);
        }

        .cohort-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <nav th:replace="~{fragments/navbar :: siteNavbar('cohorts')}"></nav>

    <section class="container my-5 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
            <div>
                <span
                    class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1 mb-2 fw-bold"
                    style="font-size: 11px;">
                    HỌC PHẦN & CHUYÊN ĐỀ ĐỘC LẬP
                </span>
                <h2 class="fw-bold text-dark mb-0">Khám phá các Module học tập</h2>
                <p class="text-muted mt-2 mb-0">Lựa chọn từng module chuyên môn để bổ trợ kỹ năng hoặc tích lũy hoàn thành trọn bộ lộ trình khóa học.</p>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0" style="max-width: 500px; width: 100%;">
                <select class="form-select form-select-sm border rounded-pill px-3" id="cohortCategoryFilter"
                    onchange="loadCohorts()">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="cat : ${categories}" th:value="${cat.slug}" th:text="${cat.name}"></option>
                </select>
                <div class="input-group input-group-sm">
                    <input type="text" id="cohortSearchInput" class="form-control border rounded-start-pill ps-3"
                        placeholder="Tìm tên module, mã chuyên đề...">
                    <button class="btn btn-primary rounded-end-pill px-3" onclick="loadCohorts()"><i
                            class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small text-muted" id="cohortsCountSummary">Đang tải danh sách...</span>
            <div class="d-flex align-items-center gap-2">
                <label class="small text-muted text-nowrap" for="cohortPageSizeSelect">Hiển thị:</label>
                <select id="cohortPageSizeSelect" class="form-select form-select-sm rounded-pill border" style="width: auto;" onchange="handleCohortPageSizeChange(this.value)">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>
        <div class="row g-4" id="cohortsGrid">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Đang tải danh sách module...</p>
            </div>
        </div>

        <div id="cohortsPaginationNav" class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2 px-1"></div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        let cohortCursor = null;
        let hasNextCohort = false;
        let cohortObserver = null;

        function debounce(fn, delay = 350) {
            let timer = null;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }
        let isLoading = false;
        let isLoadingMore = false;

        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('q')) {
                document.getElementById('cohortSearchInput').value = urlParams.get('q');
            }

            const savedCohortPageSize = localStorage.getItem('utelearn_cohort_page_size');
            const cohortPageSizeSelect = document.getElementById('cohortPageSizeSelect');
            if (savedCohortPageSize && cohortPageSizeSelect) {
                cohortPageSizeSelect.value = savedCohortPageSize;
            }
            if (cohortPageSizeSelect) {
                cohortPageSizeSelect.addEventListener('change', function () {
                    handleCohortPageSizeChange(cohortPageSizeSelect.value);
                });
            }

            const debouncedCohortSearch = debounce(() => {
                isLoading = false;
            loadInitialCohorts(0);
            }, 350);

            document.getElementById('cohortSearchInput').addEventListener('input', function () {
                debouncedCohortSearch();
            });

            document.getElementById('cohortSearchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    isLoading = false;
            loadInitialCohorts(0);
                }
            });

            isLoading = false;
            loadInitialCohorts(0);
        });

        function handleCohortPageSizeChange(val) {
            localStorage.setItem('utelearn_cohort_page_size', val);
            const cohortPageSizeSelect = document.getElementById('cohortPageSizeSelect');
            if (cohortPageSizeSelect && cohortPageSizeSelect.value !== val) {
                cohortPageSizeSelect.value = val;
            }
            isLoading = false;
            loadInitialCohorts(0);
        }

        function loadCohorts() {
            isLoading = false;
            loadInitialCohorts(0);
        }

        function createCohortCardHtml(cohort) {
            const img = cohort.thumbnailUrl || '/images/courses/default-cover.png';
            const isFree = (cohort.price == null || cohort.price <= 0);
            const priceFormatted = !isFree ? new Intl.NumberFormat('vi-VN').format(cohort.price) + ' VNĐ' : 'Miễn phí';
            const courseTitle = cohort.courseTitle ? cohort.courseTitle : 'Module độc lập';
            const badgeIcon = cohort.courseTitle ? 'bi bi-journal-bookmark' : 'bi bi-box-seam';
            const detailUrl = cohort.courseSlug ? `/courses/${cohort.courseSlug}/modules/${cohort.id}` : `/cohorts/${cohort.id}`;
            const learnUrl = cohort.courseSlug ? `/courses/${cohort.courseSlug}/modules/${cohort.id}/learn` : `/cohorts/${cohort.id}`;
            const enrollUrl = `/checkout/${cohort.id}`;
            const isAdmin = cohort.isAdmin === true;
            const isOwner = cohort.isOwner === true;
            const isEnrolled = cohort.isEnrolled === true;
            const isCourseEnrolled = cohort.isCourseEnrolled === true;
            const isCourseInCart = cohort.isCourseInCart === true;

            let statusBadge = '';
            if (isAdmin) {
                statusBadge = '<span class="badge bg-warning-subtle text-warning-emphasis ms-2 border border-warning-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-shield-lock-fill me-1"></i>Quản trị viên</span>';
            } else if (isOwner) {
                statusBadge = '<span class="badge bg-warning-subtle text-warning-emphasis ms-2 border border-warning-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-person-badge-fill me-1"></i>Module của bạn</span>';
            } else if (isEnrolled || isCourseEnrolled) {
                statusBadge = '<span class="badge bg-success-subtle text-success ms-2 border border-success-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-check-circle-fill me-1"></i>Đã sở hữu' + (isCourseEnrolled && !isEnrolled ? ' (Trọn khóa)' : '') + '</span>';
            } else if (isCourseInCart) {
                statusBadge = '<span class="badge bg-info-subtle text-info ms-2 border border-info-subtle rounded-pill px-2 py-0.5 small fw-semibold"><i class="bi bi-cart3 me-1"></i>Khóa đã trong giỏ</span>';
            } else if (isFree) {
                statusBadge = '<span class="badge bg-success-subtle text-success ms-2 border border-success-subtle rounded-pill px-2 py-0.5 small fw-semibold">Miễn phí</span>';
            } else {
                statusBadge = '<span class="badge bg-primary-subtle text-primary ms-2 border border-primary-subtle rounded-pill px-2 py-0.5 small fw-semibold">Học lẻ</span>';
            }

            return `
                <div class="col-12 col-md-6 col-lg-3 mb-4">
                    <div class="course-card h-100 d-flex flex-column">
                        <div class="course-image-wrapper position-relative">
                            <img src="${img}" alt="${cohort.name}" loading="lazy">
                            <span class="cohort-badge text-truncate" style="max-width: 88%;" title="${cohort.courseTitle ? 'Thuộc khóa: ' + cohort.courseTitle : 'Module độc lập'}">
                                <i class="${badgeIcon} me-1"></i>${courseTitle}
                            </span>
                        </div>
                        <div class="p-3.5 d-flex flex-column flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-light text-primary border rounded-pill px-2.5 py-1 small fw-semibold">${cohort.categoryName || 'Chuyên đề'}</span>
                                ${statusBadge}
                            </div>
                            <h6 class="fw-bold text-dark mb-2 lh-base line-clamp-2" title="${cohort.name}" style="min-height: 44px;">
                                <a href="${detailUrl}" class="text-dark text-decoration-none course-title-link">${cohort.name}</a>
                            </h6>
                            <div class="text-muted small mb-2 d-flex align-items-center gap-1">
                                <i class="bi bi-person-circle text-secondary"></i>
                                <span class="text-truncate">${cohort.instructorName || cohort.creatorName || 'Giảng viên'}</span>
                            </div>
                            <div class="d-flex align-items-center gap-1 mb-3">
                                ${renderRatingHtml(cohort.rating, cohort.ratingCount)}
                            </div>
                            <div class="mt-auto pt-3 border-top d-flex align-items-center justify-content-between gap-2">
                                <div class="d-flex flex-column text-nowrap">
                                    <span class="fw-bold text-success fs-6 lh-1">${priceFormatted}</span>
                                </div>
                                <div class="d-flex align-items-center gap-2 flex-shrink-0">
                                    ${(!isEnrolled && !isOwner) ? `
                                    <button type="button" class="btn btn-sm btn-outline-primary rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; flex-shrink: 0;" title="${isCourseInCart ? 'Đã có trong giỏ' : 'Thêm vào giỏ'}" onclick="addToCartCohort(event, ${cohort.id})">
                                        <i class="bi bi-cart-plus" style="font-size: 14px;"></i>
                                    </button>
                                    ` : ''}
                                    <a href="${isOwner ? detailUrl : (isEnrolled ? learnUrl : detailUrl)}" class="btn btn-sm ${isEnrolled ? 'btn-success' : (isAdmin ? 'btn-outline-warning' : (isOwner ? 'btn-warning' : 'btn-outline-primary'))} rounded-pill px-3 py-1.5 fw-semibold shadow-xs text-nowrap">
                                        ${isAdmin ? '<i class="bi bi-gear-fill me-1"></i>Quản trị' : (isOwner ? 'Giảng dạy' : (isEnrolled ? '<i class="bi bi-play-circle-fill me-1"></i>Vào học' : 'Xem chi tiết'))}
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

function showToast(message, type = 'success') {
    if (typeof Toastify === 'undefined') {
        alert(message);
        return;
    }
    let iconHtml = '';
    if (type === 'success') {
        iconHtml = `<div style="background-color: #00b050; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
    } else if (type === 'warning') {
        iconHtml = `<div style="background-color: #f5a623; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>`;
    } else if (type === 'info') {
        iconHtml = `<div style="background-color: #0ea5e9; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>`;
    } else {
        iconHtml = `<div style="background-color: #dc3545; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>`;
    }

    let toast = Toastify({
        text: `<div style="display: flex; align-items: center; gap: 10px;">
                ${iconHtml}
                <span style="color: #111; font-weight: 500; font-size: 14.5px; font-family: 'Plus Jakarta Sans', sans-serif;">${message}</span>
               </div>`,
        escapeMarkup: false,
        duration: 3000,
        close: false,
        gravity: "top",
        position: "right",
        style: {
            background: "white",
            borderRadius: "30px",
            boxShadow: "0 6px 16px rgba(0,0,0,0.12)",
            padding: "10px 20px 10px 12px",
            border: "1px solid #f0f0f0",
            cursor: "pointer"
        },
        onClick: function() {
            toast.hideToast();
        }
    });
    toast.showToast();
}

        async function addToCartCohort(event, cohortId) {
            if (event) {
                event.stopPropagation();
            }
            try {
                const params = new URLSearchParams();
                params.append('itemType', 'COHORT');
                params.append('itemId', cohortId);
                const res = await fetch('/cart/add', {
                    method: 'POST',
                    body: params,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await res.json();
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                if (data.success) {
                    showToast(data.message, 'success');
                    const badges = document.querySelectorAll('.nav-cart-badge');
                    badges.forEach(badge => {
                        badge.textContent = data.cartItemCount;
                        if (data.cartItemCount > 0) {
                            badge.classList.remove('d-none');
                        } else {
                            badge.classList.add('d-none');
                        }
                    });
                } else {
                    showToast(data.message || 'Không thể thêm vào giỏ hàng.', 'warning');
                }
            } catch (e) {
                console.error(e);
                showToast('Có lỗi xảy ra khi thêm vào giỏ hàng.', 'error');
            }
        }

        function renderRatingHtml(rating, ratingCount) {
            const count = (ratingCount && ratingCount > 0) ? Number(ratingCount) : 0;
            if (count === 0 || !rating) {
                return `
                    <span class="d-inline-flex align-items-center text-muted" style="gap: 2px; font-size: 12px;">
                        <i class="bi bi-star"></i>
                        <i class="bi bi-star"></i>
                        <i class="bi bi-star"></i>
                        <i class="bi bi-star"></i>
                        <i class="bi bi-star"></i>
                        <span class="ms-1" style="font-size: 11.5px;">(Chưa có đánh giá)</span>
                    </span>
                `;
            }

            const score = Number(rating);
            const formattedScore = score.toFixed(1);

            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (score >= i) {
                    stars += '<i class="bi bi-star-fill text-warning"></i>';
                } else if (score >= i - 0.5) {
                    stars += '<i class="bi bi-star-half text-warning"></i>';
                } else {
                    stars += '<i class="bi bi-star text-muted"></i>';
                }
            }

            return `
                <span class="fw-bold text-dark me-1" style="font-size: 13px;">${formattedScore}</span>
                <span class="d-inline-flex align-items-center" style="gap: 2px; font-size: 12px;">${stars}</span>
                <span class="text-muted small ms-1" style="font-size: 11.5px;">(${count} đánh giá)</span>
            `;
        }

        let currentCohortPage = 0;
        let totalCohortPages = 1;

        async function fetchCohortsPage(page = 0) {
            const q = document.getElementById('cohortSearchInput').value.trim();
            const category = document.getElementById('cohortCategoryFilter').value;

            const params = new URLSearchParams();
            if (q) params.append('q', q);
            if (category) params.append('category', category);
            params.append('page', page);
            const pageSizeEl = document.getElementById('cohortPageSizeSelect');
            const pageSize = pageSizeEl ? pageSizeEl.value : '10';
            params.append('size', pageSize);

            const res = await fetch('/api/cohorts?' + params.toString());
            if (!res.ok) throw new Error("Failed to fetch");
            return await res.json();
        }

        let currentCohortItems = [];
        let currentCohortRenderedCount = 0;
        const COHORT_CHUNK_SIZE = 4;
        let cohortScrollObserver = null;

        async function loadInitialCohorts(page = 0) {
            if (isLoading) return;
            isLoading = true;
            currentCohortPage = page;

            if (cohortScrollObserver) {
                cohortScrollObserver.disconnect();
            }

            const grid = document.getElementById('cohortsGrid');
            const paginationNav = document.getElementById('cohortsPaginationNav');
            if (paginationNav) paginationNav.innerHTML = '';
            grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Đang tải danh sách module...</p></div>';

            try {
                const data = await fetchCohortsPage(currentCohortPage);
                totalCohortPages = data.totalPages != null ? data.totalPages : 1;
                const totalItems = data.totalItems != null ? data.totalItems : 0;
                const countSummaryEl = document.getElementById('cohortsCountSummary');
                if (countSummaryEl) {
                    countSummaryEl.textContent = totalItems > 0 ? 'Tìm thấy ' + totalItems + ' module' : '0 module';
                }

                if (!data.content || data.content.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><p class="mt-2">Không tìm thấy module nào phù hợp.</p></div>';
                    return;
                }

                currentCohortItems = data.content;
                currentCohortRenderedCount = 0;
                grid.innerHTML = '';

                renderNextCohortChunk();
                renderCohortPagination(data.currentPage, totalCohortPages, totalItems);
            } catch (error) {
                grid.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                        <p class="mt-2">Có lỗi xảy ra khi tải danh sách module.</p>
                        <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="loadInitialCohorts(currentCohortPage)">
                            <i class="bi bi-arrow-clockwise me-1"></i>Thử lại
                        </button>
                    </div>
                `;
            } finally {
                isLoading = false;
            }
        }

        function renderNextCohortChunk() {
            const grid = document.getElementById('cohortsGrid');
            if (!grid) return;

            let sentinel = document.getElementById('cohortLazySentinel');
            if (sentinel) sentinel.remove();

            const nextEnd = Math.min(currentCohortRenderedCount + COHORT_CHUNK_SIZE, currentCohortItems.length);
            let chunkHtml = '';
            for (let i = currentCohortRenderedCount; i < nextEnd; i++) {
                chunkHtml += createCohortCardHtml(currentCohortItems[i]);
            }
            grid.insertAdjacentHTML('beforeend', chunkHtml);
            currentCohortRenderedCount = nextEnd;

            if (currentCohortRenderedCount < currentCohortItems.length) {
                const sentinelHtml = `
                    <div id="cohortLazySentinel" class="col-12 text-center py-4 my-2">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        <span class="small text-muted ms-2">Đang cuộn để tải thêm các module còn lại của trang...</span>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', sentinelHtml);
                sentinel = document.getElementById('cohortLazySentinel');

                if (cohortScrollObserver) cohortScrollObserver.disconnect();
                cohortScrollObserver = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        cohortScrollObserver.disconnect();
                        setTimeout(() => {
                            renderNextCohortChunk();
                        }, 150);
                    }
                }, { rootMargin: '120px' });
                cohortScrollObserver.observe(sentinel);
            }
        }

        function renderCohortPagination(currPage, totalPages, totalItems) {
            const nav = document.getElementById('cohortsPaginationNav');
            if (!nav) return;

            if (totalPages <= 1) {
                nav.innerHTML = `
                    <span class="small text-muted">Trang 1 / 1 (Tổng số ${totalItems} module)</span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item disabled"><span class="page-link rounded-pill px-3 me-1">Trước</span></li>
                        <li class="page-item active"><span class="page-link rounded-pill px-2.5 mx-0.5">1</span></li>
                        <li class="page-item disabled"><span class="page-link rounded-pill px-3 ms-1">Sau</span></li>
                    </ul>
                `;
                return;
            }

            const displayPage = currPage + 1;
            let btnsHtml = `
                <span class="small text-muted">Trang ${displayPage} / ${totalPages} (Tổng số ${totalItems} module)</span>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item ${currPage === 0 ? 'disabled' : ''}">
                        <button type="button" class="page-link rounded-pill px-3 me-1" data-page="${currPage - 1}">Trước</button>
                    </li>
            `;

            for (let p = 1; p <= totalPages; p++) {
                if (totalPages > 7 && Math.abs(p - displayPage) > 2 && p !== 1 && p !== totalPages) {
                    if (p === 2 || p === totalPages - 1) {
                        btnsHtml += `<li class="page-item disabled"><span class="page-link border-0">...</span></li>`;
                    }
                    continue;
                }
                btnsHtml += `
                    <li class="page-item ${p === displayPage ? 'active' : ''}">
                        <button type="button" class="page-link rounded-pill px-2.5 mx-0.5" data-page="${p - 1}">${p}</button>
                    </li>
                `;
            }

            btnsHtml += `
                    <li class="page-item ${currPage >= totalPages - 1 ? 'disabled' : ''}">
                        <button type="button" class="page-link rounded-pill px-3 ms-1" data-page="${currPage + 1}">Sau</button>
                    </li>
                </ul>
            `;
            nav.innerHTML = btnsHtml;

            nav.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pageNum = Number(btn.dataset.page);
                    loadInitialCohorts(pageNum);
                    document.getElementById('cohortsGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        }
    </script>
</body>

</html>
