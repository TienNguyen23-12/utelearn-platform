<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đợt khóa học - UTELearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        html {
            overflow-y: scroll;
        }

        :root {
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --body-bg: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--body-bg);
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .site-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .brand-logo-badge {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .brand-title {
            font-weight: 800;
            font-size: 20px;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .brand-title span {
            color: #2563eb;
        }

        .nav-link {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #2563eb;
            background-color: #eff6ff;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .course-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }

        .course-image-wrapper {
            height: 190px;
            position: relative;
            overflow: hidden;
        }

        .course-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .course-card:hover .course-image-wrapper img {
            transform: scale(1.05);
        }

        .cohort-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .user-avatar-placeholder {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <nav th:replace="~{fragments/navbar :: siteNavbar('cohorts')}"></nav>

    <section class="container my-5 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
            <div>
                <span
                    class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1 mb-2 fw-bold"
                    style="font-size: 11px;">
                    CÁC ĐỢT TUYỂN SINH MỚI NHẤT
                </span>
                <h2 class="fw-bold text-dark mb-0">Lớp học Đang mở</h2>
                <p class="text-muted mt-2 mb-0">Tìm và tham gia các lớp học được hướng dẫn trực tiếp bởi Giảng viên.</p>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0" style="max-width: 500px; width: 100%;">
                <select class="form-select form-select-sm border rounded-pill px-3" id="cohortCategoryFilter"
                    onchange="loadCohorts()">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="cat : ${categories}" th:value="${cat.slug}" th:text="${cat.name}"></option>
                </select>
                <div class="input-group input-group-sm">
                    <input type="text" id="cohortSearchInput" class="form-control border rounded-start-pill ps-3"
                        placeholder="Tìm tên lớp, mã lớp...">
                    <button class="btn btn-primary rounded-end-pill px-3" onclick="loadCohorts()"><i
                            class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="cohortsGrid">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Đang tải danh sách lớp học...</p>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('q')) {
                document.getElementById('cohortSearchInput').value = urlParams.get('q');
            }

            loadCohorts();

            document.getElementById('cohortSearchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    loadCohorts();
                }
            });
        });

        async function loadCohorts() {
            try {
                const grid = document.getElementById('cohortsGrid');
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Đang tải danh sách lớp học...</p></div>';

                const q = document.getElementById('cohortSearchInput').value;
                const category = document.getElementById('cohortCategoryFilter').value;

                const params = new URLSearchParams();
                if (q) params.append('q', q);
                if (category) params.append('category', category);

                const res = await fetch('/api/cohorts?' + params.toString());
                if (!res.ok) throw new Error("Failed to fetch");
                const data = await res.json();

                if (!data.content || data.content.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><p>Không tìm thấy lớp học nào phù hợp.</p></div>';
                    return;
                }

                let html = '';
                data.content.forEach(cohort => {
                    const img = cohort.thumbnailUrl || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80';
                    const statusBadge = cohort.status === 'UPCOMING' ? '<span class="badge bg-secondary-subtle text-secondary ms-2 border border-secondary-subtle">Sắp mở</span>' : '<span class="badge bg-success-subtle text-success ms-2 border border-success-subtle">Đang ghi danh</span>';

                    html += `
                <div class="col-lg-3 col-md-6">
                    <div class="course-card">
                        <div class="course-image-wrapper">
                            <img src="${img}" alt="${cohort.courseTitle}">
                            <span class="cohort-badge">${cohort.name}</span>
                        </div>
                        <div class="p-4 d-flex flex-column flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-light text-primary border rounded-pill px-2 py-1 small">${cohort.categoryName || 'Khác'}</span>
                                ${statusBadge}
                            </div>
                            <h6 class="fw-bold text-dark mb-2 lh-base flex-grow-1">${cohort.courseTitle}</h6>
                            <div class="text-muted small mb-3">
                                <i class="bi bi-person-fill text-secondary me-1"></i><span>${cohort.instructorName}</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top text-muted small">
                                <span><i class="bi bi-people-fill me-1"></i>${cohort.currentEnrolled}/${cohort.maxCapacity}</span>
                                <span><i class="bi bi-tag-fill me-1"></i>Mã: ${cohort.code}</span>
                            </div>
                            <div class="mt-2 text-center">
                                <span class="fw-bold text-success">${cohort.price > 0 ? new Intl.NumberFormat('vi-VN').format(cohort.price) + ' VNĐ' : 'Miễn phí'}</span>
                            </div>
                            <form action="/courses/${cohort.courseSlug}/enroll/${cohort.id}" method="post" class="mt-3 w-100">
                                <button type="submit" class="btn btn-gradient rounded-pill w-100 fw-semibold">Ghi danh</button>
                            </form>
                            <a href="/courses/${cohort.courseSlug}" class="btn btn-outline-primary rounded-pill w-100 mt-2 fw-semibold">
                                <span>Xem khóa học</span>
                            </a>
                        </div>
                    </div>
                </div>
                `;
                });
                grid.innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('cohortsGrid').innerHTML = '<div class="col-12 text-center text-danger py-5"><i class="bi bi-exclamation-triangle fs-1"></i><p>Có lỗi xảy ra khi tải danh sách lớp học.</p></div>';
            }
        }
    </script>
</body>

</html>
