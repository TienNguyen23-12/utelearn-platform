name: Render Free Tier Keep-Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render Instance
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://utelearn-platform.onrender.com"
          fi
          echo "Pinging ${TARGET_URL}/api/health..."
          curl -s -f -m 20 "${TARGET_URL}/api/health" || curl -s -f -m 20 "${TARGET_URL}/v3/api-docs" || true
