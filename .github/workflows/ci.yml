name: CI/CD Pipeline - Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Automated Testing & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x utelearn/mvnw

      - name: Run Unit Tests (Continuous Integration)
        working-directory: ./utelearn
        run: ./mvnw clean test

      - name: Package JAR Application
        working-directory: ./utelearn
        run: ./mvnw package -DskipTests
