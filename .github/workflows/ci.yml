name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  compile-and-check:
    name: "1. Code Compilation & Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'utelearn/pom.xml'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x utelearn/mvnw

      - name: Compile Java classes
        working-directory: ./utelearn
        run: ./mvnw clean compile

  unit-tests:
    name: "2. Automated Unit Tests"
    runs-on: ubuntu-latest
    needs: [compile-and-check]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'utelearn/pom.xml'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x utelearn/mvnw

      - name: Run Unit Tests
        working-directory: ./utelearn
        run: ./mvnw test

  package-jar:
    name: "3. Spring Boot JAR Packaging"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'utelearn/pom.xml'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x utelearn/mvnw

      - name: Package JAR file
        working-directory: ./utelearn
        run: ./mvnw package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: utelearn-app-jar
          path: utelearn/target/*.jar
          retention-days: 7

  docker-check:
    name: "4. Docker Container Build Check"
    runs-on: ubuntu-latest
    needs: [package-jar]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./utelearn
          file: ./utelearn/Dockerfile
          push: false
          tags: utelearn:ci-verify
